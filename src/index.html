<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#17343e" />
    <meta
      name="description"
      content="A thoughtful collection of 324 mystery, logic and visual puzzles. Thirteen ways to think, original casebooks, offline play and your own puzzle workshop."
    />
    <meta name="application-name" content="Alibi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Alibi · After hours at the puzzle club</title>

    <!-- HEAD -->
    <style>
      /* Compact 15×15 Nonograms need content-neutral row geometry. Text crosses and row clues
         remain semantic, but cannot enlarge a grid track beyond its square cell width. */
      .board-scroll.large-grid:not(.zoomed) .nono-clue:not(.col) {
        min-height: 0;
        overflow: hidden;
        gap: 4px;
        padding-right: 4px;
        font-size: 9px;
        line-height: 1;
      }
      .board-scroll.large-grid:not(.zoomed) .nono-cell {
        min-height: 0;
        overflow: hidden;
      }
      .board-scroll.large-grid:not(.zoomed) .nono-cell .cross {
        position: absolute;
        inset: 23%;
        color: #89917e;
        font-size: 0;
        line-height: 0;
        pointer-events: none;
      }
      .board-scroll.large-grid:not(.zoomed) .nono-cell .cross::before,
      .board-scroll.large-grid:not(.zoomed) .nono-cell .cross::after {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        width: 1.5px;
        height: 100%;
        border-radius: 999px;
        background: currentColor;
        transform: translateX(-50%) rotate(45deg);
      }
      .board-scroll.large-grid:not(.zoomed) .nono-cell .cross::after {
        transform: translateX(-50%) rotate(-45deg);
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to puzzles</a>
    <div id="app">
      <div class="boot">
        <h1>alibi<span style="color: #bb8746">:</span></h1>
        <p>A little room to think.</p>
        <div class="busy"><span class="spinner"></span>Opening the puzzle cabinet…</div>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toasts" class="toast-container" role="status" aria-live="polite"></div>
    <input type="file" id="pack-input" accept="application/json,.json" hidden /><input
      type="file"
      id="backup-input"
      accept="application/json,.json"
      hidden
    /><noscript
      ><p style="padding: 30px">
        Alibi needs JavaScript to run its puzzle engines. Please open this file in a full browser
        with JavaScript enabled.
      </p></noscript
    ><!-- SCRIPTS -->
  </body>
</html>
