name: Puzzle or game bug
description: Report a reproducible puzzle or interface problem
title: '[Bug] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the puzzle title/ID, expected result, and steps to reproduce. Do not include private notes or a full progress backup.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Android Chrome, iPhone Safari, desktop Firefox...
  - type: input
    id: version
    attributes:
      label: Alibi version and build
      description: Available in Settings & saves.
