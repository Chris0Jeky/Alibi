name: Fixed gameplay blob upload
on:
  push:
    branches: [codex/347-games-finish]
    paths: [.github/workflows/gameplay-fixed-blob-upload.yml]
permissions:
  contents: write
jobs:
  blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 19f45ebd880fc3f0d828688978dc028bbb789306
          persist-credentials: false
      - name: Verify fixed before/after identities and upload immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request, zlib
          encoded = ''''''
          raw = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '1f2300a614bf0ece436fead4b56a0b14fda7961b8aedcb0f712ad7ed3bda9d40'
          records = json.loads(raw)
          assert {r['path'] for r in records} == {'docs/STATE.md', 'src/backup-validation.js', 'src/club-engines.js', 'src/club.js', 'tests/browser_block_cabinet.py'}
          def blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          outputs = []
          for r in records:
              data = pathlib.Path(r['path']).read_bytes()
              assert blob(data) == r['before'], r['path']
              value = data.decode()
              for start, end, text in reversed(r['edits']):
                  value = value[:start] + text + value[end:]
              data = value.encode()
              assert blob(data) == r['after'], r['path']
              outputs.append((r, data))
          for r, data in outputs:
              request = urllib.request.Request('https://api.github.com/repos/Chris0Jeky/Alibi/git/blobs', data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
              assert result['sha'] == r['after'], r['path']
              print(r['path'], result['sha'], flush=True)
