name: Stage reviewed Android repair once

on:
  pull_request:
    paths: ['.github/workflows/android-repair-once.yml']

permissions:
  contents: read

jobs:
  stage-reviewed-blob:
    if: github.event.pull_request.number == 485 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'android/native-readiness-audit-2026-09-29'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      # No checkout and no repository code executes with this token. This stages one
      # immutable, pre-reviewed blob only. Branch/commit publication stays manual.
      - name: Stage only the fixed before-and-after metadata bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          BASE = 'https://api.github.com/repos/Chris0Jeky/Alibi/git/blobs'
          OLD = 'aa58f817f15e5b7dbd20d4e5219f1c9272064829'
          BEFORE = 'f104aa9b18ef575cf97b76541943093c53f6b5dd12df16297d4b34b33886adad'
          AFTER = 'aa12c80d3baf0c65e251b7391e75b1e76c4e9bf1b292dd666d3bfff1e9a89b95'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError('Redirect refused')
          opener = urllib.request.build_opener(NoRedirect)
          def api(url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with opener.open(req, timeout=30) as response:
                  raw = response.read(1048577)
              if len(raw) > 1048576:
                  raise ValueError('Oversized response')
              return json.loads(raw)
          original = base64.b64decode(api(BASE + '/' + OLD)['content'])
          assert len(original) == 176838 and hashlib.sha256(original).hexdigest() == BEFORE
          first = b'      <component group="com.google.guava" name="listenablefuture" version="1.0">'
          guava = b'''      <component group="com.google.guava" name="guava-parent" version="33.3.1-jre">
                   <artifact name="guava-parent-33.3.1-jre.pom">
                      <sha256 value="55441db27e8869dfefe053059bdf478bdc7e95585642bf391f0023345fd56287" origin="Maven Central bytes equal Guava v33.3.1 pom.xml; reviewed 2026-09-29"/>
                   </artifact>
                </component>
          '''.replace(b'\n          ', b'\n')
          second = b'      <component group="org.junit" name="junit-bom" version="5.10.2">\n'
          junit = b'''         <artifact name="junit-bom-5.10.2.module">
                      <sha256 value="de23b114b3e4119a8fe6eb17bed5a3852816698bace67071579d6d927ebb080a" origin="Maven Central bytes and published SHA-256 sidecar; reviewed 2026-09-29"/>
                   </artifact>
          '''.replace(b'\n          ', b'\n')
          assert original.count(first) == original.count(second) == 1
          result = original.replace(first, guava + first).replace(second, second + junit)
          assert len(result) == 177437 and hashlib.sha256(result).hexdigest() == AFTER
          assert result.replace(guava, b'').replace(junit, b'') == original
          blob = api(BASE, {'content': base64.b64encode(result).decode(), 'encoding': 'base64'})
          expected = hashlib.sha1(b'blob ' + str(len(result)).encode() + b'\0' + result).hexdigest()
          assert blob['sha'] == expected
          print(json.dumps({'gitBlob': expected, 'sha256': AFTER, 'bytes': len(result),
                            'branchUpdated': False, 'evidence': 'exact-reviewed-metadata-blob'}))
          PY
  source-deltas:
    if: github.event.pull_request.number == 485 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: native
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f7f78f61ae40a2cd3673f05348d75efcf7bb93b4
          path: insets
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact deltas against the supplied source archive
        run: |
          mkdir -p evidence
          for lane in native insets; do
            git -C "$lane" diff --binary f41c452dfeb659e733ae3e5fcfb479d7df5f1fff HEAD > "evidence/$lane.patch"
            git -C "$lane" cat-file commit HEAD > "evidence/$lane.commit"
            git -C "$lane" ls-files --stage > "evidence/$lane.index"
            git -C "$lane" rev-parse HEAD > "evidence/$lane.sha"
          done
          sha256sum evidence/* > evidence/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-repair-source-${{ github.event.pull_request.head.sha }}
          path: evidence
          retention-days: 3
