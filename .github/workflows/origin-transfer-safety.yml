name: Origin transfer safety
on:
  pull_request:
    paths:
      - 'src/origin-transfer.js'
      - 'tests/origin-transfer*.test.cjs'
      - 'tests/browser_origin_transfer_open.py'
      - 'tests/browser_origin_transfer_recovery.py'
      - 'requirements-dev.txt'
      - '.github/workflows/origin-transfer-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  origin-transfer-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Preserve exact source identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p test-results/origin-transfer-safety
          printf '{"sourceSha":"%s","treeSha":"%s"}\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > test-results/origin-transfer-safety/source-head.json
          sha256sum src/origin-transfer.js tests/origin-transfer*.test.cjs tests/browser_origin_transfer_open.py tests/browser_origin_transfer_recovery.py requirements-dev.txt .github/workflows/origin-transfer-safety.yml | tee test-results/origin-transfer-safety/inputs.sha256
      - name: Exercise all transfer coordinator contracts
        run: |
          set -o pipefail
          node --test tests/origin-transfer*.test.cjs 2>&1 | tee test-results/origin-transfer-safety/source-tests.log
      - run: npm ci
        id: dependencies
        if: ${{ !cancelled() }}
      - name: Require pinned formatting, complete build and unchanged budgets
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee test-results/origin-transfer-safety/full-verify.log
      - name: Install pinned standalone browser tooling
        id: browser
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' \
            'Dir::Etc::sourceparts "-";' \
            | sudo tee /etc/apt/apt.conf.d/99alibi-ci-sources >/dev/null
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Exercise origin-transfer IndexedDB ports in two tabs
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: |
          set -o pipefail
          python tests/browser_origin_transfer_open.py 2>&1 | tee test-results/origin-transfer-safety/browser-open.log
          python tests/browser_origin_transfer_recovery.py 2>&1 | tee test-results/origin-transfer-safety/browser-recovery.log
      - name: Verify source was not rewritten during qualification
        if: ${{ !cancelled() }}
        run: |
          sha256sum --check test-results/origin-transfer-safety/inputs.sha256
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: origin-transfer-safety-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/origin-transfer-safety/
            build-info.json
          if-no-files-found: error
          retention-days: 14
