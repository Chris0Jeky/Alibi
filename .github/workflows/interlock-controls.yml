name: Interlock study controls
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/interlock-controls.yml'
permissions:
  contents: read
concurrency:
  group: interlock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record the exact checked-out head
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p test-results/interlock-source
          git rev-parse HEAD > test-results/interlock-source/source-head.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - name: Save formatter diagnostics without changing checked-out source
        run: |
          mkdir -p test-results/interlock-source/format
          for file in tools/official-data-codec.cjs tools/build-official-content.cjs tests/interlock-*.test.cjs tests/official-data-codec.test.cjs tests/official-deferred.test.cjs; do
            npx --no-install prettier "$file" > "test-results/interlock-source/format/$(basename "$file")"
          done
      - name: Use Ubuntu dependencies only
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99alibi-ci-sources >/dev/null
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends ffmpeg >/dev/null
          fi
      - name: Verify unchanged budgets, all source tests and Android payload
        run: npm run verify
      - name: Validate selection and build the browser origin
        run: |
          python -m unittest discover -s tests -p test_interlock_selection.py -v
          npm run build:web
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Play every registered study at phone and desktop sizes
        run: |
          python -m http.server 8787 --directory dist > test-results/interlock-source/server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/ >/dev/null
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_interlock_studies.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: interlock-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/interlock-source/
            test-results/interlock-study-controls/
            build-info.json
          retention-days: 14
          if-no-files-found: error
