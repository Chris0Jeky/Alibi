name: Apply discovery CAS formatting
on:
  push:
    branches:
      - feat/discovery-meta-cas-30
permissions:
  contents: write
concurrency:
  group: discovery-cas-format-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/discovery-meta-cas-30
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format discovery files and remove this probe
        run: |
          npx prettier --write src/discovery-storage.js tests/storage.test.cjs tools/build.cjs
          git rm .github/workflows/format-discovery-cas.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/discovery-storage.js tests/storage.test.cjs tools/build.cjs
          git commit -m "style(discovery): apply canonical formatter output"
          git push origin HEAD:feat/discovery-meta-cas-30
