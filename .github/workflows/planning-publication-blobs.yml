name: Fixed planning publication blobs
on:
  push:
    branches: [codex/346-348-planning-vaults]
    paths: [.github/workflows/planning-publication-blobs.yml]
permissions:
  contents: write
jobs:
  blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 19f45ebd880fc3f0d828688978dc028bbb789306
          persist-credentials: false
      - name: Verify six fixed edits before creating immutable blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request, zlib
          encoded = ''''''
          raw = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == 'ee73ae8e4ae84568a427b67fba7a47a7cdda324a7bb3ef3c0b8baab8fe20894b'
          records = json.loads(raw)
          assert {r['path'] for r in records} == {'docs/STATE.md','src/challenge-launcher.js','src/challenges.js','src/quiet-wing/app.js','tools/build.cjs','tools/curation/replay_challenges.cjs'}
          def blob(data):
              return hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
          outputs = []
          for r in records:
              data = pathlib.Path(r['path']).read_bytes()
              assert blob(data) == r['before'], r['path']
              text = data.decode()
              for start,end,value in reversed(r['edits']):
                  text = text[:start] + value + text[end:]
              data = text.encode()
              assert blob(data) == r['after'], r['path']
              outputs.append((r,data))
          for r,data in outputs:
              request = urllib.request.Request('https://api.github.com/repos/Chris0Jeky/Alibi/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request) as response: result=json.load(response)
              assert result['sha'] == r['after'], r['path']
              print(r['path'],result['sha'],flush=True)
