name: Format service-worker regression

on:
  push:
    branches:
      - fix/sw-owned-cache-fallback
    paths:
      - tests/sw-cache-isolation.test.cjs
      - .github/workflows/format-sw-cache.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/sw-owned-cache-fallback
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/sw-cache-isolation.test.cjs
      - name: Commit formatting
        run: |
          if git diff --quiet -- tests/sw-cache-isolation.test.cjs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/sw-cache-isolation.test.cjs
          git commit -m "style(sw): format cache isolation regression"
          git push origin HEAD:fix/sw-owned-cache-fallback
