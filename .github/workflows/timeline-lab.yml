name: Timeline Desk controls
on:
  pull_request:
    paths:
      - 'src/timeline-lab/**'
      - 'src/activities.js'
      - 'src/app.js'
      - 'tools/build*.cjs'
      - 'tests/timeline*.test.*'
      - 'tests/browser_timeline_lab.py'
      - 'tools/ci-ubuntu-sources.sh'
      - '.github/workflows/timeline-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timeline-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  timeline-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: npm run format:check
      - run: npm run build:android
      - name: Check rules, content, saves and optional activity lifecycle
        run: node --test tests/timeline*.test.cjs tests/timeline*.test.mjs tests/activities*.test.cjs
      - run: python -m pip install -r requirements-dev.txt
      - name: Configure signed Ubuntu package mirrors
        run: bash tools/ci-ubuntu-sources.sh
      - name: Install Chromium with bounded setup
        run: node tools/ci-setup-phase.cjs --phase playwright-chromium --timeout-seconds 480 --grace-seconds 20 -- python -m playwright install --with-deps chromium
      - name: Play levels and exercise local feedback, recovery and offline routes
        run: python tests/browser_timeline_lab.py
      - name: Retain source and browser evidence
        if: always()
        run: |
          mkdir -p test-results/timeline-lab
          git rev-parse HEAD > test-results/timeline-lab/source-sha.txt
          git rev-parse HEAD^{tree} > test-results/timeline-lab/tree-sha.txt
          cp build-info.json test-results/timeline-lab/build-info.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: timeline-lab-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/timeline-lab/
          retention-days: 14
