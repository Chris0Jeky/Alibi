name: Reconcile journal candidate state
on:
  push:
    branches:
      - fix/journal-unique-solved-count-147
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/journal-unique-solved-count-147
      - name: Record the source candidate without rewriting release history
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const filename = 'docs/STATE.md';
          const before = fs.readFileSync(filename, 'utf8');
          const marker = '## Bellweather beacon Nonogram curation in 0.11.3, 2026-09-12';
          const section = `## Journal identity-count candidate after 0.11.3, 2026-09-15
          
          Current source corrects the journal's aggregate **Puzzles solved** total to count unique published
          puzzle IDs rather than completed revision records. Saved revision snapshots remain separate and
          reopenable: the real-origin regression stores completed Aquarium revisions 1 and 2 plus one
          separate completed Aquarium, retains all three records, and reports two solved puzzle identities.
          The refreshed asset catalogue matches the edited application source. The current-head comprehensive
          and Wrenmere workflows passed before this documentation closeout. Release 0.11.3 remains unchanged
          and still accurately records the deployed limitation; no hosted publication or physical-device
          acceptance is claimed by this source candidate.
          
          `.replace(/^          /gm, '');
          if (!before.includes(marker)) throw new Error('Candidate insertion marker not found.');
          if (before.includes('## Journal identity-count candidate after 0.11.3')) {
            throw new Error('Candidate section already exists.');
          }
          fs.writeFileSync(filename, before.replace(marker, section + marker));
          NODE
          git diff --check
      - name: Commit the live-state closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/STATE.md
          git commit -m "docs(state): record journal identity-count candidate"
          git push
