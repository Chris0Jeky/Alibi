name: Challenge lifecycle controls
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'content/challenges/**'
      - 'tools/build-quiet-pack.cjs'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/challenge-lifecycle.yml'
permissions:
  contents: read
concurrency:
  group: challenge-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_HEAD: ${{ github.event.pull_request.base.sha || '339f9e0e65aa0413f9a0dbdcdd7f3b84e67ff0f7' }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Record exact source and unchanged ceilings
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p test-results/challenge-source/format
          git rev-parse HEAD > test-results/challenge-source/source-head.txt
          git diff --exit-code "$BASE_HEAD" -- tests/budget.test.cjs
          for file in src/challenge-launcher.js src/challenge-storage.js tools/build-quiet-pack.cjs tests/challenge-lifecycle.test.cjs tests/quiet-css-{delivery,built}.test.cjs; do
            npx --no-install prettier "$file" > "test-results/challenge-source/format/$(basename "$file")"
          done
      - name: Install test dependencies
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99alibi-ci-sources >/dev/null
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends ffmpeg >/dev/null
          fi
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Verify source, budgets and Android payload
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee test-results/challenge-source/verify.log
      - name: Compare with the unmodified base build
        run: |
          set -o pipefail
          base="$RUNNER_TEMP/challenge-base"
          git worktree add --detach "$base" "$BASE_HEAD"
          trap 'git worktree remove --force "$base"' EXIT
          test "$(git -C "$base" rev-parse HEAD)" = "$BASE_HEAD"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$base/node_modules"
          (cd "$base" && node tools/build.cjs) 2>&1 | tee test-results/challenge-source/base-build.log
          cp "$base/build-info.json" test-results/challenge-source/base-build-info.json
          node - <<'JS'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('test-results/challenge-source/base-build-info.json'));
          const after = JSON.parse(fs.readFileSync('build-info.json'));
          const fields = ['javascriptGzipBytes', 'initialCodeAndContentGzipBytes', 'coreOfflineBytes', 'quietWingBytes'];
          const measurements = Object.fromEntries(fields.map(k => [k, {before: before[k], after: after[k], delta: after[k] - before[k]}]));
          const receipt = {sourceHead: process.env.EXPECTED_HEAD, baseHead: process.env.BASE_HEAD, measurements};
          fs.writeFileSync('test-results/challenge-source/delivery.json', JSON.stringify(receipt, null, 2));
          console.log(receipt);
          if (!(after.quietWingBytes < before.quietWingBytes)) throw Error('Quiet Wing delivery did not shrink');
          JS
      - name: Exercise challenge lifecycle and existing Quiet Wing controls
        run: |
          python tests/browser_challenge_lifecycle.py
          python tests/browser_challenge_library.py
          python tests/browser_quiet.py
          python tests/browser_calm.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: challenge-lifecycle-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/challenge-source/
            test-results/challenge-lifecycle/
            test-results/challenge-library/
            test-results/quiet-wing/
            build-info.json
          retention-days: 14
          if-no-files-found: error
