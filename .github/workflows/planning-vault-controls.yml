name: Planning vault controls
on:
  pull_request:
    paths:
      - 'src/challenge*.js'
      - 'src/quiet-wing/**'
      - 'src/club-engines.js'
      - 'content/challenges/**'
      - 'tools/build*.cjs'
      - 'tools/challenge-catalogue.cjs'
      - 'tools/curation/replay_challenges.cjs'
      - 'tests/*planning*'
      - 'tests/archive-vaults.test.cjs'
      - 'tests/helpers/archive-push-oracle.cjs'
      - '.github/workflows/planning-vault-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: planning-vault-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build:web
      - run: node --test tests/planning-vault-integration.test.cjs tests/planning-audit.test.cjs tests/archive-vaults.test.cjs tests/challenges.test.cjs tests/budget.test.cjs
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Record tested source and execute the actual-origin matrix
        env:
          ALIBI_ISOLATED: '0'
        run: |
          mkdir -p test-results/planning-expansion
          git rev-parse HEAD > test-results/planning-expansion/tested-checkout.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > test-results/planning-expansion/submitted-head.txt
          python tests/browser_planning_expansion.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: planning-vault-controls
          path: test-results/planning-expansion/
          retention-days: 7
