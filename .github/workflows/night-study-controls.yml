name: Night study controls
on:
  pull_request:
    paths:
      - 'content/extra/night-*.json'
      - 'content/curation/editorial/night-*.json'
      - 'content/official-packs.json'
      - 'src/**'
      - 'tests/browser_night_studies.py'
      - 'tests/test_night_study_selection.py'
      - 'tests/browser_master_grandmaster_controls.py'
      - '.github/workflows/night-study-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: night-study-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Verify complete registered Night selection
        run: python tests/test_night_study_selection.py -v
      - run: npm ci
      - run: npm run build:web
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Complete every registered Night study through actual controls
        run: |
          mkdir -p test-results/night-study-controls
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > test-results/night-study-controls/source-head.txt
          npm start > /tmp/alibi-night-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/ > /dev/null && break
            sleep 1
          done
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_night_studies.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: night-study-control-evidence
          path: test-results/night-study-controls/
          retention-days: 14
