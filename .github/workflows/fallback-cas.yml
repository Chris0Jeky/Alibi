name: Fallback save concurrency
on:
  pull_request:
    paths:
      - 'src/storage.js'
      - 'src/core.js'
      - 'src/boot.js'
      - 'tools/build.cjs'
      - 'tests/storage*.test.cjs'
      - 'tests/boot*.test.cjs'
      - 'tests/browser_fallback_cas.py'
      - '.github/workflows/fallback-cas.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fallback-cas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fallback-cas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve exact committed inputs before executing repository code
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p test-results/fallback-cas
          printf '{"sourceSha":"%s","treeSha":"%s"}\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > test-results/fallback-cas/source-head.json
          git archive --format=tar --prefix=source/ HEAD | gzip -n > test-results/fallback-cas/source.tar.gz
          sha256sum test-results/fallback-cas/source.tar.gz
          sha256sum src/storage.js src/core.js src/boot.js tools/build.cjs package.json package-lock.json tests/storage-fallback-cas.test.cjs tests/browser_fallback_cas.py .github/workflows/fallback-cas.yml | tee test-results/fallback-cas/inputs.sha256
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Source concurrency and existing storage contracts
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node --test tests/storage-fallback-cas.test.cjs tests/storage.test.cjs tests/storage-revision.test.cjs tests/storage-restore.test.cjs tests/recovery.test.cjs 2>&1 | tee test-results/fallback-cas/source-tests.log
      - run: npm ci
        id: dependencies
        if: ${{ !cancelled() }}
      - name: Required pinned formatting
        id: formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee test-results/fallback-cas/format.log
      - name: Retain formatter diagnostic without editing tracked source
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const prettier = require('prettier');
          (async () => {
            const file = 'src/storage.js';
            const options = await prettier.resolveConfig(file);
            const formatted = await prettier.format(fs.readFileSync(file, 'utf8'), { ...options, filepath: file });
            fs.writeFileSync('test-results/fallback-cas/storage.formatted.js', formatted);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          diff -u src/storage.js test-results/fallback-cas/storage.formatted.js || test "$?" -eq 1
      - run: python -m pip install -r requirements-dev.txt
        id: python-dependencies
        if: ${{ !cancelled() }}
      - name: Install browser using Ubuntu package sources
        id: browser-install
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' }}
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99alibi-ci-sources >/dev/null
          python -m playwright install --with-deps chromium
      - name: Native two-page fallback-save scenarios
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: |
          set -o pipefail
          python tests/browser_fallback_cas.py 2>&1 | tee test-results/fallback-cas/browser.log
      - name: Complete build, unchanged budgets and Node suites
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee test-results/fallback-cas/full-verify.log
      - name: Verify tested source remained unchanged
        if: ${{ !cancelled() }}
        run: |
          sha256sum --check test-results/fallback-cas/inputs.sha256
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fallback-cas-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-info.json
            test-results/fallback-cas/
          retention-days: 14
          if-no-files-found: error
