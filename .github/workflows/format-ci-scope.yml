name: Format CI scope implementation
on:
  push:
    branches:
      - ci/publication-receipt-fast-path-149
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ci/publication-receipt-fast-path-149
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format and verify scoped CI files
        run: |
          npx prettier --write tools/ci-scope.cjs tests/ci-scope.test.cjs
          node --test tests/ci-scope.test.cjs
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/ci-scope.cjs tests/ci-scope.test.cjs
          git diff --cached --quiet || git commit -m "style(ci): format scope classifier"
          git push
