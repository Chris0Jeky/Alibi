name: Prepare scoped keyboard candidate
on:
  push:
    branches: [codex/272-mark-grid-keys]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'Chris0Jeky/Alibi' && github.ref == 'refs/heads/codex/272-mark-grid-keys'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed exact-source patch and validate
        run: |
          node tools/prepare-272.cjs
          node node_modules/prettier/bin/prettier.cjs --write src/app.js src/presentation.js tests/mark-grid-navigation.test.cjs
          node --test tests/mark-grid-navigation.test.cjs
          python -m py_compile tests/mark_grid_cases.py tests/browser_ui.py
          git diff --check
      - name: Commit only scoped candidate files to its branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js src/presentation.js tests/mark-grid-navigation.test.cjs tests/mark_grid_cases.py tests/browser_ui.py docs/STATE.md
          git commit -m 'fix(keyboard): retain marking tools and bound navigation to rendered marks (#272)'
          git push origin HEAD:refs/heads/codex/272-mark-grid-keys
      - name: Measure candidate build against existing budgets
        run: |
          npm run build
          node tests/budget.test.cjs
      - name: Retain build measurements and exact candidate source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyboard-candidate-validation
          retention-days: 2
          path: |
            build-info.json
            src/app.js
            src/presentation.js
            tests/mark-grid-navigation.test.cjs
            tests/mark_grid_cases.py
            tests/browser_ui.py
            docs/STATE.md
