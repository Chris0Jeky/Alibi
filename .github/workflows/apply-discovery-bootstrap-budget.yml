name: Apply discovery bootstrap budget fix
on:
  push:
    branches:
      - feat/discovery-meta-cas-30
permissions:
  contents: write
concurrency:
  group: discovery-bootstrap-budget-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/discovery-meta-cas-30
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Remove unwired bootstrap pointer and preserve acceptance coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          build = Path('tools/build.cjs')
          build_lines = build.read_text(encoding='utf-8').splitlines(keepends=True)
          pointer = 'globalThis.ALIBI_DISCOVERY_STORAGE_URL='
          matches = [line for line in build_lines if pointer in line]
          if len(matches) != 1:
              raise SystemExit(f'Expected one discovery bootstrap pointer, found {len(matches)}')
          build.write_text(''.join(line for line in build_lines if pointer not in line), encoding='utf-8')

          browser = Path('tests/browser_discovery_storage.py')
          browser_lines = browser.read_text(encoding='utf-8').splitlines(keepends=True)
          lazy_field = 'lazyAsset: ALIBI_DISCOVERY_STORAGE_URL,'
          field_matches = [line for line in browser_lines if lazy_field in line]
          if len(field_matches) != 1:
              raise SystemExit(f'Expected one browser lazy asset field, found {len(field_matches)}')
          browser_lines = [line for line in browser_lines if lazy_field not in line]

          lookup = 'lazy_url = URL + "/" + runtime["lazyAsset"].removeprefix("./")'
          lookup_matches = [index for index, line in enumerate(browser_lines) if lookup in line]
          if len(lookup_matches) != 1:
              raise SystemExit(f'Expected one browser lazy asset lookup, found {len(lookup_matches)}')
          index = lookup_matches[0]
          indent = browser_lines[index][:len(browser_lines[index]) - len(browser_lines[index].lstrip())]
          block = f'''{indent}lazy_asset = await page_a.evaluate(
          {indent}    """async () => {{
          {indent}      const response = await fetch('/sw.js', {{cache: 'no-store'}});
          {indent}      const source = await response.text();
          {indent}      return source.match(/\\.\\/assets\\/discovery-storage\\.[a-f0-9]{{12}}\\.js/)?.[0] || null;
          {indent}    }}"""
          {indent})
          {indent}check(
          {indent}    lazy_asset,
          {indent}    "Hashed discovery CAS asset is present in the offline release",
          {indent})
          {indent}lazy_url = URL + "/" + lazy_asset.removeprefix("./")
          '''
          browser_lines[index:index + 1] = [block]
          browser.write_text(''.join(browser_lines), encoding='utf-8')
          PY
          npx prettier --write tools/build.cjs
          python -m py_compile tests/browser_discovery_storage.py
          node --check src/discovery-storage.js
          npm run build
          node tests/budget.test.cjs
          node --test tests/discovery-entitlements.test.cjs
          ! grep -R "ALIBI_DISCOVERY_STORAGE_URL" tools/build.cjs tests/browser_discovery_storage.py
          git rm .github/workflows/apply-discovery-bootstrap-budget.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/build.cjs tests/browser_discovery_storage.py
          git commit -m "fix(discovery): keep lazy storage out of bootstrap"
          git push origin HEAD:feat/discovery-meta-cas-30
