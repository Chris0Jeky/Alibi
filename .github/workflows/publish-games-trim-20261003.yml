name: Publish bounded Club size and focus fix
on:
  push:
    branches: [codex/gameplay-result-retention-20261003]
    paths: [.github/workflows/publish-games-trim-20261003.yml]
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.repository == 'Chris0Jeky/Alibi' &&
      github.actor == 'Chris0Jeky' &&
      github.event.before == '15f1b4c887f8c5423bd30e32d4eba967c3b09da2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply the exact measured delta and focus regression
        run: |
          set -eu
          echo 'ed28b25930f2279ac933fe8174a409815248a5252c2cac031ae5a92640a5088f  src/club.js' | sha256sum -c -
          git apply --unidiff-zero games-trim-20261003.patch
          echo '2ef17e742e3cdb069fa44b0acf169abe34fdf75e36e76ec7091b006fdbdd0ae3  src/club.js' | sha256sum -c -
          cat >> tests/club-result-retention.test.cjs <<'JS'

          test('Next garden moves focus to the new board status after the old control disappears', async () => {
            const tab = await open(fixture('regiongardens'), 'regiongardens');
            let focused = 0;
            tab.nodes.set('garden-status', { focus() { focused++; }, scrollIntoView() {} });
            await tab.action('garden-level', { value: '1' });
            assert.equal(focused, 1);
            assert.equal(tab.state().runs.regiongardens.level, 1);
          });
          JS
      - run: npm ci
      - name: Verify source regressions and unchanged budgets
        run: |
          npx --no-install prettier --write src/club.js tests/club-result-retention.test.cjs tests/club-engine-routing.test.cjs
          node --test tests/club-*.test.cjs tests/duel-*.test.cjs tests/games-room-polish.test.cjs
          npm run build:android
          node --test tests/budget.test.cjs
          git diff --check
      - name: Record measured scope
        shell: python
        run: |
          from pathlib import Path
          path=Path('docs/STATE.md')
          text=path.read_text(); heading='# Live development state\n'
          assert text.startswith(heading)
          note='\n## 2026-10-03: Games Room replay journal and focus (draft #556)\n\nRefs #418. Completed results are retained before replay, Next garden or a\nfinished match seat/strength change, using the existing bounded idempotent\njournal. Play again has a stable control ID; garden resets focus the new board\nstatus. Shared engine routing and action membership remove duplicate emitted\ncode instead of raising byte ceilings. All 71 targeted source regressions and\nthe unchanged emitted budget test pass in branch publication. Final-head full\nCI, actual browser focus/persistence and independent review remain required.\nLocal browser navigation is blocked by managed browser policy; do not mistake\nsource control tests for browser acceptance. HUMAN_TODO.md remains open.\n'
          path.write_text(heading+note+text[len(heading):])
      - name: Publish only the branch and remove staging helpers
        env:
          TARGET_BRANCH: codex/gameplay-result-retention-20261003
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git diff --name-only > /tmp/club-changed
          python - <<'PY'
          from pathlib import Path
          paths=set(Path('/tmp/club-changed').read_text().splitlines())
          assert paths <= {'src/club.js','tests/club-result-retention.test.cjs','tests/club-engine-routing.test.cjs','docs/STATE.md'},paths
          assert 'src/club.js' in paths
          PY
          git rm .github/workflows/publish-games-trim-20261003.yml games-trim-20261003.patch
          git add src/club.js tests/club-result-retention.test.cjs tests/club-engine-routing.test.cjs docs/STATE.md
          git -c user.name='Cristian Tcaci' -c user.email='59696583+Chris0Jeky@users.noreply.github.com' commit -m 'fix(club): focus new gardens and recover payload headroom by deduplication'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
