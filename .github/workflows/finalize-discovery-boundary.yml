name: Finalize discovery delivery boundary
on:
  push:
    branches:
      - feat/discovery-meta-cas-30
permissions:
  contents: write
concurrency:
  group: finalize-discovery-boundary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/discovery-meta-cas-30
          fetch-depth: 0
      - name: Align source and documentation with deferred delivery
        run: |
          python - <<'PY'
          from pathlib import Path

          docs = Path('docs/DISCOVERY-ENTITLEMENTS.md')
          source = docs.read_text(encoding='utf-8')
          old = """`src/discovery-storage.js` is minified into a content-hashed asset, included in the release fingerprint
          and offline service-worker shell, and exposed through `ALIBI_DISCOVERY_STORAGE_URL`. It is deliberately
          absent from the initial JavaScript bundle, preserving the cabinet's startup budget while the feature
          has no runtime consumer. The standalone HTML does not load this adapter yet and must not be described
          as discovery-ready.
          """.replace('          ', '')
          new = """`src/discovery-storage.js` is minified into a content-hashed distribution asset and included in the
          release fingerprint. Because the feature has no runtime consumer, the hosted build does not advertise
          its URL in the initial JavaScript and the core service worker does not install it. Browser acceptance
          resolves the exact hashed file from the built distribution and deliberately loads it from the same
          origin. The standalone HTML does not load this adapter. This keeps both startup and core-offline
          budgets unchanged until a reviewed presenter owns loading and an explicit offline policy.
          """.replace('          ', '')
          if source.count(old) != 1:
              raise SystemExit(f'Expected one stale delivery paragraph, found {source.count(old)}')
          docs.write_text(source.replace(old, new, 1), encoding='utf-8')

          module = Path('src/discovery-storage.js')
          source = module.read_text(encoding='utf-8')
          old = '/* Atomic persistence for the unwired discovery-entitlement state. Loaded on demand. */'
          new = (
              '// Atomic persistence for the unwired discovery-entitlement state.\n'
              '// Emitted as a deferred, non-precache asset until a presenter owns loading.'
          )
          if source.count(old) != 1:
              raise SystemExit(f'Expected one storage header, found {source.count(old)}')
          module.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          node --check src/discovery-storage.js
          npx prettier --check src/discovery-storage.js
          git rm .github/workflows/finalize-discovery-boundary.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/DISCOVERY-ENTITLEMENTS.md src/discovery-storage.js
          git commit -m "docs(discovery): state the deferred storage boundary"
          git push origin HEAD:feat/discovery-meta-cas-30
