name: Practice deferred acceptance
on:
  pull_request:
    paths:
      - 'src/castle-practice.js'
      - 'src/app.js'
      - 'tools/build*.cjs'
      - 'tools/check-android-artifact.cjs'
      - 'tests/*practice*.cjs'
      - 'tests/browser_practice_deferred.py'
      - '.github/workflows/practice-deferred.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  practice-deferred:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Capture immutable candidate inputs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p test-results/practice-deferred
          printf '{"sourceSha":"%s","treeSha":"%s"}\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > test-results/practice-deferred/source-head.json
          git archive --format=tar --prefix=source/ HEAD | gzip -n > test-results/practice-deferred/source.tar.gz
          sha256sum src/castle-practice.js src/app.js tools/build.cjs tools/build-android.cjs tools/check-android-artifact.cjs tests/browser_practice_deferred.py > test-results/practice-deferred/inputs.sha256
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Require full pinned verification and original byte ceilings
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee test-results/practice-deferred/verify.log
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium with Ubuntu repositories
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99alibi-ci-sources >/dev/null
          python -m playwright install --with-deps chromium
      - name: Native app-owned practice counts through failure and recovery
        run: |
          set -o pipefail
          python tests/browser_practice_deferred.py 2>&1 | tee test-results/practice-deferred/browser.log
      - name: Check exact source remained unchanged
        if: ${{ !cancelled() }}
        run: |
          sha256sum --check test-results/practice-deferred/inputs.sha256
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: practice-deferred-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/practice-deferred/
            build-info.json
          retention-days: 14
          if-no-files-found: error
