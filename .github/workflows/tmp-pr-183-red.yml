name: Temporary PR 183 red verification

on:
  push:
    branches:
      - feat/observatory-puzzle-journey-18

permissions:
  contents: write

jobs:
  verify-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format and prove the contract is red
        run: |
          npx prettier --write tests/observatory-journey.test.cjs
          set +e
          node --test tests/observatory-journey.test.cjs > "$RUNNER_TEMP/pr-183-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/pr-183-red.log"
          test "$status" -ne 0
          grep -q 'journey adapter emits only bounded events' "$RUNNER_TEMP/pr-183-red.log"
          grep -q 'application lifecycle calls the adapter' "$RUNNER_TEMP/pr-183-red.log"
      - name: Publish the formatted red contract
        run: |
          rm .github/workflows/tmp-pr-183-red.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: format bounded Observatory journey contract'
          git push origin HEAD:feat/observatory-puzzle-journey-18
