name: Apply PR 157 review fixes

on:
  push:
    branches:
      - feat/discovery-entitlement-contract-30

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply reviewed determinism and validation fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(text, before, after, expected, label) {
            const count = text.split(before).length - 1;
            if (count !== expected) {
              throw Error(`${label}: expected ${expected} match(es), found ${count}`);
            }
            return text.split(before).join(after);
          }

          const sourcePath = 'src/discovery-entitlements.js';
          let source = fs.readFileSync(sourcePath, 'utf8');
          source = replaceExact(
            source,
            "  const copy = (value) => JSON.parse(JSON.stringify(value));\n\n  function object",
            "  const copy = (value) => JSON.parse(JSON.stringify(value));\n\n  function compareText(left, right) {\n    return left < right ? -1 : left > right ? 1 : 0;\n  }\n\n  function object",
            1,
            'insert locale-independent comparator',
          );
          source = replaceExact(
            source,
            'a.sourceKey.localeCompare(b.sourceKey)',
            'compareText(a.sourceKey, b.sourceKey)',
            1,
            'source ordering',
          );
          source = replaceExact(
            source,
            "if (source.kind === 'catalogue' && source.rewardEligible) {",
            "if (source.kind === 'catalogue' && source.authority === 'official' && source.rewardEligible) {",
            1,
            'official bootstrap authority',
          );
          source = replaceExact(
            source,
            'left.occurredAt.localeCompare(right.occurredAt)',
            'compareText(left.occurredAt, right.occurredAt)',
            1,
            'receipt time ordering',
          );
          source = replaceExact(
            source,
            'left.contentKey.localeCompare(right.contentKey)',
            'compareText(left.contentKey, right.contentKey)',
            1,
            'receipt content ordering',
          );
          source = replaceExact(
            source,
            'left.evidence.recordKey.localeCompare(right.evidence.recordKey)',
            'compareText(left.evidence.recordKey, right.evidence.recordKey)',
            1,
            'receipt evidence ordering',
          );
          source = replaceExact(
            source,
            'a.receiptKey.localeCompare(b.receiptKey)',
            'compareText(a.receiptKey, b.receiptKey)',
            2,
            'receipt-key ordering',
          );
          source = replaceExact(
            source,
            'left.localeCompare(right)',
            'compareText(left, right)',
            1,
            'expression ordering',
          );
          source = replaceExact(
            source,
            'a.entitlementKey.localeCompare(b.entitlementKey)',
            'compareText(a.entitlementKey, b.entitlementKey)',
            2,
            'entitlement ordering',
          );
          source = replaceExact(
            source,
            'a.grantId.localeCompare(b.grantId)',
            'compareText(a.grantId, b.grantId)',
            1,
            'grant ordering',
          );
          source = replaceExact(
            source,
            "left.receiptKeys.join('\\u0000').localeCompare(right.receiptKeys.join('\\u0000'))",
            "compareText(left.receiptKeys.join('\\u0000'), right.receiptKeys.join('\\u0000'))",
            1,
            'any-witness ordering',
          );
          source = replaceExact(
            source,
            "\n  function validateDefinition(value) {",
            "\n  function witnessUpperBound(expression) {\n    if (expression.op === 'source') return 1;\n    const counts = expression.terms.map(witnessUpperBound);\n    if (expression.op === 'any') return Math.max(...counts);\n    let total = 0;\n    for (const count of counts) {\n      total += count;\n      if (total > LIMITS.prerequisiteTerms) return LIMITS.prerequisiteTerms + 1;\n    }\n    return total;\n  }\n\n  function validateDefinition(value) {",
            1,
            'aggregate witness calculator',
          );
          source = replaceExact(
            source,
            "    const category = text(value.category, 'Entitlement category');\n    if (!CATEGORIES.has(category)) throw Error('Entitlement category is unsupported.');\n    return {\n      schema: SCHEMA,\n      entitlementKey: semanticKey(value.entitlementKey, 'Entitlement key', 'grant:'),\n      category,\n      prerequisite: validateExpression(value.prerequisite),\n    };",
            "    const category = text(value.category, 'Entitlement category');\n    if (!CATEGORIES.has(category)) throw Error('Entitlement category is unsupported.');\n    const prerequisite = validateExpression(value.prerequisite);\n    if (witnessUpperBound(prerequisite) > LIMITS.prerequisiteTerms)\n      throw Error('A prerequisite can require too many receipts.');\n    return {\n      schema: SCHEMA,\n      entitlementKey: semanticKey(value.entitlementKey, 'Entitlement key', 'grant:'),\n      category,\n      prerequisite,\n    };",
            1,
            'aggregate witness validation',
          );
          if (source.includes('localeCompare')) throw Error('A locale-dependent ordering remains.');
          fs.writeFileSync(sourcePath, source);

          const testPath = 'tests/discovery-entitlements.test.cjs';
          let tests = fs.readFileSync(testPath, 'utf8');
          tests = replaceExact(
            tests,
            "test('a trusted receipt creates one category-separated grant and durable outbox item', () => {",
            "test('legacy bootstrap accepts only official catalogue authority', () => {\n  const definition = puzzle('registered-scene');\n  const registration = source(definition, {\n    sourceKey: 'catalogue:registered-scene',\n    authority: 'registered',\n  });\n  const runs = [\n    {\n      schemaVersion: 1,\n      key: 'registered-scene@1',\n      puzzle: definition,\n      firstCompletedAt: '2026-09-01T09:00:00Z',\n      completedAt: '2026-09-01T09:00:00Z',\n    },\n  ];\n  assert.deepEqual(D.bootstrapCatalogueReceipts(runs, [registration]), []);\n});\n\ntest('a trusted receipt creates one category-separated grant and durable outbox item', () => {",
            1,
            'official bootstrap regression',
          );
          tests = replaceExact(
            tests,
            "test('sequential any receipts converge regardless of arrival order', () => {",
            "test('canonical ordering does not depend on host locale collation', () => {\n  const upper = source(puzzle('A'), { sourceKey: 'catalogue:A' });\n  const lower = source(puzzle('a'), { sourceKey: 'catalogue:a' });\n  const upperReceipt = receipt(upper, '2026-09-01T09:00:00Z');\n  const lowerReceipt = receipt(lower, '2026-09-01T09:00:00Z');\n  const reward = entitlement(\n    'skill:locale-independent',\n    'skill-progress',\n    any(requires(lower.sourceKey), requires(upper.sourceKey)),\n  );\n  const originalLocaleCompare = String.prototype.localeCompare;\n  let state;\n  String.prototype.localeCompare = () => {\n    throw Error('Host locale collation was used.');\n  };\n  try {\n    state = apply(\n      D.emptyState(),\n      [lower, upper],\n      [reward],\n      [lowerReceipt, upperReceipt],\n    ).state;\n  } finally {\n    String.prototype.localeCompare = originalLocaleCompare;\n  }\n  assert.deepEqual(state.owned[0].receiptKeys, [upperReceipt.receiptKey]);\n});\n\ntest('sequential any receipts converge regardless of arrival order', () => {",
            1,
            'locale-independent ordering regression',
          );
          tests = replaceExact(
            tests,
            "test('bounds and expression depth fail before mutating the caller state', () => {",
            "test('nested prerequisites cannot exceed the aggregate grant receipt bound', () => {\n  const left = Array.from({ length: 20 }, (_, index) => requires(`catalogue:left-${index}`));\n  const right = Array.from({ length: 13 }, (_, index) => requires(`catalogue:right-${index}`));\n  const prerequisite = all(all(...left), all(...right));\n  assert.throws(\n    () =>\n      apply(\n        D.emptyState(),\n        [],\n        [entitlement('room:too-many-witnesses', 'room-access', prerequisite)],\n        [],\n      ),\n    /prerequisite can require too many receipts/i,\n  );\n});\n\ntest('bounds and expression depth fail before mutating the caller state', () => {",
            1,
            'aggregate witness regression',
          );
          fs.writeFileSync(testPath, tests);

          const docsPath = 'docs/DISCOVERY-ENTITLEMENTS.md';
          let docs = fs.readFileSync(docsPath, 'utf8');
          docs = replaceExact(
            docs,
            '`authority: "local"` and `kind: "local-import"` are always ineligible. A local pack may retain its\nown receipt for history, but it cannot satisfy an official entitlement. The fingerprint prevents an\nedited local copy with a reused ID and revision from passing legacy bootstrap. It is an integrity\nand identity check, not a secret or competitive anti-tamper mechanism; Alibi is a static local app.',
            '`authority: "local"` and `kind: "local-import"` are always ineligible. A local pack may retain its\nown receipt for history, but it cannot satisfy an official entitlement. Legacy catalogue bootstrap\nalso requires `authority: "official"`; registered challenge or story sources need their own committed\nreceipts. The fingerprint prevents an edited local copy with a reused ID and revision from passing\nbootstrap. It is an integrity and identity check, not a secret or competitive anti-tamper mechanism;\nAlibi is a static local app.',
            1,
            'document bootstrap authority',
          );
          docs = replaceExact(
            docs,
            'The deterministic grant timestamp is the latest timestamp among the prerequisite receipts that\nactually satisfied the definition. An `any` prerequisite chooses the lexicographically smallest\nsatisfied witness, so input ordering cannot alter the state.',
            'The deterministic grant timestamp is the latest timestamp among the prerequisite receipts that\nactually satisfied the definition. An `any` prerequisite chooses the smallest satisfied witness by\nexplicit UTF-16 code-unit order, so browser locale and input ordering cannot alter the state. The\nmaximum aggregate witness is bounded to the same 32 receipts accepted by a grant.',
            1,
            'document deterministic ordering',
          );
          docs = replaceExact(
            docs,
            'Version 1 caps source registrations, source revisions, receipts, definitions, grants, prerequisite\nwidth/depth and bootstrap runs.',
            'Version 1 caps source registrations, source revisions, receipts, definitions, grants, prerequisite\nwidth, depth, aggregate witnesses and bootstrap runs.',
            1,
            'document aggregate bound',
          );
          fs.writeFileSync(docsPath, docs);
          NODE
      - name: Format and verify focused contract
        run: |
          npx prettier --write src/discovery-entitlements.js tests/discovery-entitlements.test.cjs
          node --check src/discovery-entitlements.js
          node --test tests/discovery-entitlements.test.cjs
          git diff --check
      - name: Commit review fixes
        run: |
          git add src/discovery-entitlements.js tests/discovery-entitlements.test.cjs docs/DISCOVERY-ENTITLEMENTS.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(core): make entitlement validation deterministic'
          git push origin "HEAD:${GITHUB_REF_NAME}"
