name: Format Android boot regression

on:
  push:
    branches:
      - fix/android-boot-recovery-235

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/android-boot-target.test.cjs
      - name: Emit formatted test
        shell: bash
        run: |
          echo '---TEST-BASE64---'
          base64 -w0 tests/android-boot-target.test.cjs
          echo
