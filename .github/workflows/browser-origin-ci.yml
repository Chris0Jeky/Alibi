name: Cabinet real-origin browser shard

on:
  workflow_call:
    inputs:
      slice:
        required: true
        type: string
      artifact-id:
        required: true
        type: string
      archive-sha256:
        required: true
        type: string
    outputs:
      receipt:
        value: ${{ jobs.browser.outputs.receipt }}

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    outputs:
      receipt: ${{ steps.receipt.outputs.value }}
    env:
      PYTHONUTF8: '1'
      SLICE: ${{ inputs.slice }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Restore the verified cabinet build
        uses: ./.github/actions/restore-cabinet-build
        with:
          artifact-id: ${{ inputs.artifact-id }}
          sha256: ${{ inputs.archive-sha256 }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Use Ubuntu repositories for CI system dependencies
        run: bash tools/ci-ubuntu-sources.sh
      - name: Install Chromium and its system dependencies
        run: node tools/ci-setup-phase.cjs --phase playwright-chromium --timeout-seconds 480 --grace-seconds 20 -- python -m playwright install --with-deps chromium
      - name: Exercise real IndexedDB and offline play
        run: |
          node tools/ci-browser-origin-shadow.cjs "$SLICE" > "$RUNNER_TEMP/alibi-origin.sh"
          bash -e "$RUNNER_TEMP/alibi-origin.sh"
      - name: Preserve browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alibi-origin-evidence-${{ inputs.slice }}-attempt-${{ github.run_attempt }}
          path: |
            tests/*-results.json
            tests/quiet-wing/*-results.json
            tests/screenshots/
            test-results/browser-origin/*.json
            test-results/workshop-ownership/
            test-results/backup-ownership/
            test-results/completion-hooks/
            test-results/browser-backup-import.json
            test-results/browser-update/*.json
            test-results/mobile-qa/
            test-results/browser-expedition/**/*.json
            test-results/browser-expedition/**/*.png
            test-results/*.png
            test-results/afterhours-club/
            test-results/club-pictograms/
            test-results/browser-restart/
            test-results/browser-rooms/
            test-results/browser-boot/
            test-results/quiet-wing/
            test-results/atmosphere/
            test-results/curation-ui/
            test-results/discovery/
            test-results/discovery-storage/
            test-results/edge-layout/
            test-results/library-focus/
            test-results/quiet-focus/
            test-results/delivery/
            test-results/theatre/
            test-results/curation-check/
            test-results/challenges-replay.json
            test-results/challenge-library/
            test-results/challenge-lifecycle/
            test-results/large-nonogram/
            test-results/expert-browser/
            test-results/expert-control/
            test-results/expert-nonogram/
            test-results/tic-tac-toe/
            test-results/player-qa/
            test-results/feedback-discovery/
            test-results/september-feedback/
            test-results/block-motion/
          retention-days: 14
      - name: Record successful browser verification
        id: receipt
        env:
          BUILD_SHA256: ${{ inputs.archive-sha256 }}
        run: |
          dispatch=workflow_
          if [[ "$GITHUB_REF" == refs/heads/codex/ci-957-fault-canary && "$GITHUB_EVENT_NAME" == "${dispatch}dispatch" && "$SLICE" == 4 && "$GITHUB_RUN_ATTEMPT" == 2 ]]; then exit 0; fi
          printf 'value=%s:%s:%s:origin-%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$BUILD_SHA256" "$SLICE" >> "$GITHUB_OUTPUT"
