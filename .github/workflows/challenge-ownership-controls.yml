name: Challenge ownership controls
on:
  pull_request:
    paths:
      - 'src/quiet-wing/app.js'
      - 'src/challenge-storage.js'
      - 'src/challenge-launcher.js'
      - 'tests/challenge-host-ownership.test.cjs'
      - 'tests/browser_challenge_ownership.py'
      - '.github/workflows/challenge-ownership-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: challenge-ownership-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci
      - run: node --test tests/challenge-host-ownership.test.cjs
      - run: npm run build:web
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Record exact source and exercise built-origin races
        run: |
          mkdir -p test-results/challenge-ownership
          git rev-parse HEAD > test-results/challenge-ownership/source-head.txt
          cp build-info.json test-results/challenge-ownership/build-info.json
          python tests/browser_challenge_ownership.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: challenge-ownership-controls
          path: test-results/challenge-ownership/
          retention-days: 7
