name: Deferred puzzle loading controls
on:
  pull_request:
    paths:
      - 'src/app.js'
      - 'tools/build-official-content.cjs'
      - 'tests/official-deferred.test.cjs'
      - 'tests/deferred-*.test.cjs'
      - 'tests/browser_deferred_loading.py'
      - '.github/workflows/deferred-loading-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deferred-loading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build:web
      - run: node --test tests/deferred-*.test.cjs tests/official-deferred.test.cjs tests/asset-catalogue.test.cjs tests/budget.test.cjs
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Record exact source and exercise real loading controls
        run: |
          set -eu
          mkdir -p test-results/deferred-loading
          git rev-parse HEAD > test-results/deferred-loading/source-head.txt
          cp build-info.json test-results/deferred-loading/build-info.json
          python -m http.server 8787 --directory dist > test-results/deferred-loading/server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/ >/dev/null
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_deferred_loading.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deferred-loading-controls
          path: test-results/deferred-loading/
          if-no-files-found: error
          retention-days: 14
