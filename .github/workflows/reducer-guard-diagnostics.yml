name: Reducer guard diagnostics

on:
  pull_request:
    paths:
      - src/core.js
      - src/engines.js
      - tests/scene-reducer-guards.test.cjs
      - .github/workflows/reducer-guard-diagnostics.yml

permissions:
  contents: read

jobs:
  reducer-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Show exact formatter diff
        run: |
          npx --no-install prettier tests/scene-reducer-guards.test.cjs > "$RUNNER_TEMP/reducer-guards.formatted.cjs"
          diff -u tests/scene-reducer-guards.test.cjs "$RUNNER_TEMP/reducer-guards.formatted.cjs"
      - name: Run dependency-free regressions
        if: always()
        run: node --test tests/scene-reducer-guards.test.cjs tests/core.test.cjs tests/bridges.test.cjs tests/state-notes.test.cjs
