name: Gameplay source recovery
on:
  push:
    branches: [codex/347-games-finish]
    paths: [.github/workflows/gameplay-source-recovery.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 19f45ebd880fc3f0d828688978dc028bbb789306
          persist-credentials: false
      - name: Export exact tracked source
        run: |
          mkdir -p /tmp/gameplay-source
          git rev-parse HEAD > /tmp/gameplay-source/head.txt
          git archive --format=tar.gz HEAD > /tmp/gameplay-source/source.tar.gz
          sha256sum /tmp/gameplay-source/source.tar.gz > /tmp/gameplay-source/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gameplay-main-source
          path: /tmp/gameplay-source/
          retention-days: 1
