name: Deferred practice progress controls
on:
  pull_request:
    paths:
      - 'src/castle-practice.js'
      - 'src/castle/practice.mjs'
      - 'tools/build-official-content.cjs'
      - 'tests/castle-practice-deferred.test.cjs'
      - 'tests/browser_castle_practice_deferred.py'
      - '.github/workflows/practice-deferred-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: practice-deferred-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run format:check
      - run: node --test tests/castle-practice-deferred.test.cjs
      - run: npm run build:web
      - run: node --test tests/budget.test.cjs
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install chromium
      - name: Verify real completion counts across failed and retried definition loads
        run: |
          set -eu
          mkdir -p test-results/castle-practice-deferred
          git rev-parse HEAD > test-results/castle-practice-deferred/source-head.txt
          cp build-info.json test-results/castle-practice-deferred/build-info.json
          npm start > test-results/castle-practice-deferred/server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/ >/dev/null
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_castle_practice_deferred.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: practice-deferred-controls
          path: test-results/castle-practice-deferred/
          retention-days: 14
          if-no-files-found: error
