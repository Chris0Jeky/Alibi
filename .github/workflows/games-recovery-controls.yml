name: Games recovery controls
on:
  pull_request:
    paths:
      - 'src/club.js'
      - 'src/club-engines.js'
      - 'src/backup-validation.js'
      - 'src/block-cabinet/**'
      - 'tests/duel-*.test.cjs'
      - 'tests/club-fresh-seed.test.cjs'
      - 'tests/browser_gameplay_continuation.py'
      - 'tests/browser_block_cabinet.py'
      - '.github/workflows/games-recovery-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: games-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci
      - run: node --test tests/duel-*.test.cjs tests/club-fresh-seed.test.cjs
      - run: npm run build:web
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Exercise built-origin games
        run: |
          mkdir -p test-results/gameplay-continuation
          git rev-parse HEAD > test-results/gameplay-continuation/source-head.txt
          npm start > /tmp/alibi-games-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/ > /dev/null && break
            sleep 1
          done
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_gameplay_continuation.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_block_cabinet.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: games-recovery-controls
          path: test-results/gameplay-continuation/
          retention-days: 7
