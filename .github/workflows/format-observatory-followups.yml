name: Format Observatory follow-ups
on:
  push:
    branches:
      - fix/observatory-pilot-followups-106
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/observatory-pilot-followups-106
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format and refresh provenance
        run: |
          npx prettier --write src/observatory-loader.js tests/observatory-loader.test.cjs
          node tools/assets/catalogue.cjs
      - name: Verify targeted integration
        run: |
          node --test tests/observatory-loader.test.cjs
          python -m py_compile tests/browser_observatory.py
          npm run build
          node observatory/check.mjs
          npm run format:check
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/observatory-loader.js tests/observatory-loader.test.cjs assets-source/library/catalogue.json
          git diff --cached --quiet || git commit -m "style(observatory): format pilot follow-ups"
          git push
