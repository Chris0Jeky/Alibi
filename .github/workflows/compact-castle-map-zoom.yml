name: Compact reconciled Castle map controls
on:
  push:
    branches:
      - feat/castle-map-zoom-45
permissions:
  contents: write
concurrency:
  group: compact-castle-map-zoom-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/castle-map-zoom-45
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Replace duplicate zoom controls with one native range
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one fragment in {path}, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/castle/pages.mjs',
              '  mapZoom,\n  search,',
              '  mapZoom: zoomStep,\n  search,',
          )
          replace_once(
              'src/castle/pages.mjs',
              '      zoom = Math.round(mapZoom * 100),\n      stageWidth = Math.round(560 * mapZoom);',
              '      zoom = zoomStep * 25;',
          )
          replace_once(
              'src/castle/pages.mjs',
              '''<div class="map-zoom" aria-label="Map zoom">${button('Zoom out', 'map-zoom', 'out', mapZoom <= 1 ? 'disabled' : '')}<output class="map-zoom-status" aria-live="polite">${zoom}%</output>${button('Zoom in', 'map-zoom', 'in', mapZoom >= 1.75 ? 'disabled' : '')}${button('Reset', 'map-zoom', 'reset', mapZoom === 1 ? 'disabled' : '')}</div>''',
              '''<div class="row"><input id="map-zoom" type="range" min="4" max="7" value="${zoomStep}" aria-label="Map zoom"><output class="map-zoom-status" aria-live="polite">${zoom}%</output>${button('Reset', 'map-reset', '', zoomStep === 4 ? 'disabled' : '')}</div>''',
          )
          replace_once(
              'src/castle/pages.mjs',
              'aria-label="Estate map at ${zoom} percent, scroll across to explore"><div class="map-stage" style="width:${zoom}%;min-width:${stageWidth}px">',
              'aria-label="Estate map ${zoom}%"><div class="map-stage" style="width:${zoom}%;min-width:${140 * zoomStep}px">',
          )
          replace_once(
              'src/castle/pages.mjs',
              'Select a numbered door, or choose a named entrance below. On a small screen you can move across the grounds. Zoom changes only this map, not the page.',
              'Choose a door below. Pan or zoom this map.',
          )

          replace_once('src/castle/view.mjs', '    mapZoom = 1,', '    mapZoom = 4,')
          replace_once(
              'src/castle/view.mjs',
              'No close-up artwork is available for this object. Its complete description is below.',
              'No close-up artwork is available. The description follows.',
          )
          view = Path('src/castle/view.mjs')
          text = view.read_text(encoding='utf-8')
          start = text.index('  function captureMapViewport() {')
          end = text.index('  async function action(event) {', start)
          text = text[:start] + '''  function redrawMap(focus) {
            let map = $('.map-scroll');
            const centre = (map.scrollLeft + map.clientWidth / 2) / map.scrollWidth;
            render();
            map = $('.map-scroll');
            map.scrollLeft = centre * map.scrollWidth - map.clientWidth / 2;
            $(focus).focus({ preventScroll: true });
          }
          '''.replace('          ', '') + text[end:]
          action_start = text.index("    else if (name === 'visit') visit(value);")
          action_end_marker = "    else if (name === 'object') inspect(value);"
          action_end = text.index(action_end_marker, action_start) + len(action_end_marker)
          text = text[:action_start] + '''    else if (name === 'visit') visit(value);
          else if (name === 'select' || name === 'era') {
            if (name === 'select') selected = value;
            else era = value;
            redrawMap(`[data-do="${name}"][data-value="${value}"]`);
          } else if (name === 'map-reset') {
            mapZoom = 4;
            redrawMap('#map-zoom');
          } else if (name === 'object') inspect(value);'''.replace('          ', '') + text[action_end:]
          marker = "      } else if (el.id === 'clock-answer' && active === 'clock') {"
          if text.count(marker) != 1:
              raise SystemExit('Castle input handler changed unexpectedly.')
          text = text.replace(
              marker,
              "      } else if (el.id === 'map-zoom') {\n        mapZoom = +el.value;\n        redrawMap('#map-zoom');\n      } else if (el.id === 'clock-answer' && active === 'clock') {",
              1,
          )
          view.write_text(text, encoding='utf-8')

          replace_once(
              'src/castle/native-style.mjs',
              '.map-zoom{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.map-zoom button{padding-inline:10px}.map-zoom-status{min-width:4ch;text-align:center;font-variant-numeric:tabular-nums;color:#eee5cf}',
              '',
          )

          browser = Path('tests/browser_castle_exploration.py')
          text = browser.read_text(encoding='utf-8')
          old = '''                zoom_in=page.locator('[data-do="map-zoom"][data-value="in"]')
                zoom_in.focus()
                zoom_in.press('Enter')'''
          new = '''                zoom_control=page.get_by_label('Map zoom')
                zoom_control.focus()
                zoom_control.press('ArrowRight')'''
          if text.count(old) != 1:
              raise SystemExit('Castle zoom browser setup changed unexpectedly.')
          text = text.replace(old, new, 1)
          if text.count('expect(zoom_in).to_be_focused()') != 2:
              raise SystemExit('Castle zoom focus assertions changed unexpectedly.')
          text = text.replace('expect(zoom_in).to_be_focused()', 'expect(zoom_control).to_be_focused()')
          old = 'page.locator(\'[data-do="map-zoom"][data-value="reset"]\').click()'
          if text.count(old) != 1:
              raise SystemExit('Castle zoom reset control changed unexpectedly.')
          text = text.replace(old, 'page.locator(\'[data-do="map-reset"]\').click()', 1)
          browser.write_text(text, encoding='utf-8')
          PY
          npx prettier --write src/castle/pages.mjs src/castle/view.mjs src/castle/native-style.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm --ignore-unmatch .github/workflows/compact-castle-map-zoom.yml
          git add src/castle/pages.mjs src/castle/view.mjs src/castle/native-style.mjs tests/browser_castle_exploration.py
          git diff --cached --check
          node --test tests/castle*.test.mjs
          npm run build
          git commit -m "fix(castle): compact map zoom controls"
          git push origin HEAD:feat/castle-map-zoom-45
