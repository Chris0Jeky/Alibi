name: Offline navigation recovery
on:
  pull_request:
    paths:
      - 'tools/build.cjs'
      - 'tools/serve.cjs'
      - 'src/boot.js'
      - 'tests/sw*.test.cjs'
      - 'tests/browser_offline_navigation.py'
      - '.github/workflows/offline-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-navigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run format:check
      - run: npm run build:android
      - name: Prove source, emitted-worker and unchanged byte budgets
        run: node --test tests/sw*.test.cjs tests/budget.test.cjs
      - run: python -m pip install -r requirements-dev.txt
      - name: Install browser using Ubuntu package sources
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99alibi-ci-sources >/dev/null
          python -m playwright install --with-deps chromium
      - run: python tests/browser_offline_navigation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-navigation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-info.json
            test-results/offline-navigation/
          retention-days: 14
