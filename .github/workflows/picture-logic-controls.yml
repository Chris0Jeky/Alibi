name: Picture Logic study controls
on:
  pull_request:
    paths:
      - 'content/extra/keepers-picture-studies.json'
      - 'content/official-packs.json'
      - 'src/core.js'
      - 'src/insights.js'
      - 'tests/browser_picture_controls.py'
      - 'tests/browser_master_grandmaster_controls.py'
      - '.github/workflows/picture-logic-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: picture-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prior-failure-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Collect previous verification log without modifying sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          gh api --allow-escape-sequences repos/Chris0Jeky/Alibi/actions/jobs/107744486168/logs > evidence/previous-verify.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prior-verify-failure
          path: evidence/previous-verify.log
          retention-days: 7
  browser-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - name: Retain canonical test formatting for review
        run: |
          mkdir -p test-results/picture-controls
          node_modules/.bin/prettier tests/picture-logic-collection.test.cjs > test-results/picture-controls/formatted-test.cjs
      - run: npm run build:web
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Complete and restore all six studies through real controls
        run: |
          npm start > /tmp/alibi-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/ > /dev/null && break
            sleep 1
          done
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_picture_controls.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: picture-control-evidence
          path: test-results/picture-controls/
          retention-days: 14
