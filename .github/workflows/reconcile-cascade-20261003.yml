name: Reconcile bounded Cascade follow-up
on:
  push:
    branches: [codex/cascade-narrow-controls-20261003]
    paths: [.github/workflows/reconcile-cascade-20261003.yml]
permissions:
  contents: read
jobs:
  reconcile:
    if: >-
      github.repository == 'Chris0Jeky/Alibi' &&
      github.actor == 'Chris0Jeky' &&
      github.event.before == 'd870804d24b5dd1a2fa6cf223d659c2c2b24f6af'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      REVIEWED_SOURCE: d870804d24b5dd1a2fa6cf223d659c2c2b24f6af
      PARENT_SOURCE: fc51d98808774b67e48129cdc7a2aa79409b4fd7
      ORIGINAL_PARENT: cf77a14d606ed59eeb87073ec983a76255033965
      TARGET_BRANCH: codex/cascade-narrow-controls-20261003
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Merge the pinned parent, preserving both state histories and the exact CSS fix
        shell: python
        run: |
          import os, subprocess, tempfile
          from pathlib import Path
          from collections import Counter
          def git(*args):
              return subprocess.run(['git',*args],check=True,capture_output=True).stdout
          source,parent=os.environ['REVIEWED_SOURCE'],os.environ['PARENT_SOURCE']
          assert git('rev-parse','HEAD^').decode().strip()==source
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          ancestor=git('merge-base','HEAD',parent).decode().strip()
          assert ancestor==os.environ['ORIGINAL_PARENT']
          result=subprocess.run(['git','merge','--no-commit','--no-ff',parent])
          conflicts=git('diff','--name-only','--diff-filter=U').decode().splitlines()
          assert result.returncode in (0,1)
          assert set(conflicts)<= {'docs/STATE.md'},conflicts
          if conflicts:
              ours,theirs,common=(git('show',ref+':docs/STATE.md') for ref in ('HEAD',parent,ancestor))
              with tempfile.TemporaryDirectory() as folder:
                  paths=[Path(folder)/name for name in ('ours','base','theirs')]
                  for p,data in zip(paths,(ours,common,theirs)):p.write_bytes(data)
                  git('merge-file','--union',*(str(p) for p in paths))
                  merged=paths[0].read_bytes()
              counts=Counter(merged.splitlines())
              for original in (ours,theirs):
                  assert all(counts[line]>=n for line,n in Counter(original.splitlines()).items())
              Path('docs/STATE.md').write_bytes(merged)
              git('add','docs/STATE.md')
          git('rm','.github/workflows/reconcile-cascade-20261003.yml')
          expected={'.github/workflows/cascade-controls.yml','src/block-cabinet/style.css','tests/browser_cascade_controls.py','docs/STATE.md'}
          actual=set(git('diff','--cached','--name-only',parent).decode().splitlines())
          assert actual==expected,(actual,expected)
          for path in expected-{'docs/STATE.md'}:
              assert git('show',':'+path)==git('show',source+':'+path),path
          git('diff','--cached','--check')
          git('commit','-m','Merge reviewed Games Room parent into Cascade narrow-layout follow-up')
      - run: npm ci
      - name: Verify the clean integration and preserve source evidence
        run: |
          set -o pipefail
          mkdir -p test-results/cascade-integration
          npm run verify 2>&1 | tee test-results/cascade-integration/verify.log
          git rev-parse HEAD > test-results/cascade-integration/source-head.txt
          git diff --binary "$PARENT_SOURCE" HEAD > test-results/cascade-integration/source.patch
          cp build-info.json test-results/cascade-integration/build-info.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cascade-integration-evidence
          path: test-results/cascade-integration/
          retention-days: 7
      - name: Publish only the unchanged branch
        run: |
          set -eu
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
