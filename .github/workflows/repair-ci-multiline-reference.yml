name: Repair multiline reference validation
on:
  push:
    branches:
      - ci/publication-receipt-fast-path-149
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ci/publication-receipt-fast-path-149
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Add the multiline regression and prove it fails
        run: |
          python - <<'PY'
          from pathlib import Path

          filename = Path('tests/ci-scope.test.cjs')
          text = filename.read_text()
          marker = "test('comparison environment accepts real non-zero SHAs only', () => {"
          regression = r"""test('publication verification validates continued reference definitions', () => {
            const root = fixture({
              'docs/STATE.md': '# State\nSee [receipt][details].\n\n[details]:\n  missing.md\n',
            });
            assert.match(
              verifyDocuments(root, ['docs/STATE.md']).join('\n'),
              /missing local target/,
            );
          });

          """
          if text.count(marker) != 1:
              raise SystemExit('Comparison-test insertion marker not found exactly once.')
          filename.write_text(text.replace(marker, regression + marker))
          PY
          if node --test --test-name-pattern='continued reference definitions' tests/ci-scope.test.cjs; then
            echo 'Multiline reference regression unexpectedly passed before the parser fix.' >&2
            exit 1
          fi
      - name: Parse one-line and continued reference destinations
        run: |
          python - <<'PY'
          from pathlib import Path

          filename = Path('tools/ci-scope.cjs')
          text = filename.read_text()
          old = "const REFERENCE_LINK = /^[ \\t]{0,3}\\[[^\\]\\r\\n]+\\]:[ \\t]*(?:<([^>\\r\\n]+)>|(\\S+))/gm;"
          new = "const REFERENCE_LINK = /^[ \\t]{0,3}\\[[^\\]\\r\\n]+\\]:[ \\t]*(?:\\r?\\n[ \\t]{0,3})?(?:<([^>\\r\\n]+)>|(\\S+))/gm;"
          if text.count(old) != 1:
              raise SystemExit('Reference parser marker not found exactly once.')
          filename.write_text(text.replace(old, new))
          PY
          node --test tests/ci-scope.test.cjs
          npx prettier --write tools/ci-scope.cjs tests/ci-scope.test.cjs
          node --test tests/ci-scope.test.cjs
          git diff --check
      - name: Commit the reviewed parser fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/ci-scope.cjs tests/ci-scope.test.cjs
          git commit -m "fix(ci): validate multiline reference links"
          git push
