name: Integrate phone QA candidate (temporary)
on:
  push:
    branches: [fix/phone-play-qa-214]
    paths:
      - .github/workflows/phone-qa-integrate.yml
      - .github/phone-qa-patch.*
permissions:
  contents: write
concurrency:
  group: phone-qa-integrate
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'Chris0Jeky/Alibi' && github.ref == 'refs/heads/fix/phone-play-qa-214' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE: 86e737ed018f84ed848748ea567bd47ad8ac9cd5
      BRANCH: fix/phone-play-qa-214
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Verify pinned patch and unchanged source base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import gzip, hashlib, os, subprocess
          from pathlib import Path
          allowed = {'.github/workflows/phone-qa-integrate.yml', *[f'.github/phone-qa-patch.{n}' for n in range(1,4)]}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE'], 'HEAD'], text=True).splitlines())
          if not changed <= allowed:
              raise SystemExit(f'Refusing to replace concurrent source changes: {changed - allowed}')
          compressed = b''.join(Path(f'.github/phone-qa-patch.{n}').read_bytes() for n in range(1,4))
          patch = gzip.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != '1ebcdcb7cd7e52abfed7714e76ddaa0938040b0dde6db7505afba922590ef59a':
              raise SystemExit('Patch fingerprint mismatch')
          Path('/tmp/phone-qa-source.patch').write_bytes(patch)
          PY
          git apply --check /tmp/phone-qa-source.patch
          git apply /tmp/phone-qa-source.patch
          git diff --check
          git diff --stat
      - run: npm ci
      - name: Format changed source with pinned toolchain and refresh inventory
        run: |
          npx --no-install prettier --write src/app.js src/after-hours.css src/index.html tests/metadata.test.cjs
          node tools/assets/catalogue.cjs
      - name: Use Ubuntu repositories for browser and audio dependencies
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99alibi-ci-sources >/dev/null
          if ! command -v ffprobe >/dev/null; then sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg; fi
      - run: npm run verify
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Exercise existing gameplay and actual-origin phone regressions
        run: |
          set -euo pipefail
          python tests/browser_club.py
          npm start > /tmp/alibi-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8787/ > /dev/null && break; sleep 1; done
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_mobile_qa.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_narrow_layout.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_feedback_discovery.py
      - name: Commit only the reviewed source files to this branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git diff --check
          git add src/app.js src/after-hours.css src/index.html tests/browser_mobile_qa.py tests/metadata.test.cjs tests/browser_club.py tests/browser_narrow_layout.py tests/browser_feedback_discovery.py docs/STATE.md docs/ux/MOBILE-QA-2026-09-21.md assets-source/library/catalogue.json
          git -c user.name='Alibi UX automation' -c user.email='59696583+Chris0Jeky@users.noreply.github.com' commit -m 'fix(ux): put phone boards first and repair modal and shell usability'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD
      - name: Retain exact candidate files and diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          paths = ['src/app.js','src/after-hours.css','src/index.html','tests/browser_mobile_qa.py','tests/metadata.test.cjs','tests/browser_club.py','tests/browser_narrow_layout.py','tests/browser_feedback_discovery.py','docs/STATE.md','docs/ux/MOBILE-QA-2026-09-21.md','assets-source/library/catalogue.json']
          with ZipFile('phone-qa-candidate-files.zip','w',ZIP_DEFLATED) as z:
              for name in paths:
                  if Path(name).is_file(): z.write(name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phone-qa-integration-evidence
          path: |
            phone-qa-candidate-files.zip
            alibi-deluxe-cloudflare.zip
            build-info.json
            test-results/mobile-qa/
            test-results/edge-layout/
            test-results/feedback-discovery/
            test-results/afterhours-club/
          retention-days: 7
