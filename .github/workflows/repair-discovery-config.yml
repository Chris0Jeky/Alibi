name: Repair discovery build configuration
on:
  push:
    branches:
      - feat/discovery-meta-cas-30
permissions:
  contents: write
concurrency:
  group: repair-discovery-config-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/discovery-meta-cas-30
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore the build preamble and keep unwired storage deferred
        run: |
          git show deeee10bfca344544c0496998c15ff8a84ba9da4:tools/build.cjs > /tmp/build.cjs
          python - <<'PY'
          from pathlib import Path

          build = Path('/tmp/build.cjs').read_text(encoding='utf-8')

          pointer = 'globalThis.ALIBI_DISCOVERY_STORAGE_URL=${JSON.stringify(discoveryStorageURL)};\\n'
          if build.count(pointer) != 1:
              raise SystemExit(f'Expected one discovery pointer in parent build, found {build.count(pointer)}')
          build = build.replace(pointer, '', 1)

          precache = '    discoveryStorageURL,\n'
          if build.count(precache) != 1:
              raise SystemExit(f'Expected one discovery precache entry, found {build.count(precache)}')
          build = build.replace(precache, '', 1)

          accounting = '      Buffer.byteLength(observatory) -\n      blockMotion.bytes -'
          replacement = (
              '      Buffer.byteLength(observatory) -\n'
              '      Buffer.byteLength(discoveryStorage) -\n'
              '      blockMotion.bytes -'
          )
          if build.count(accounting) != 1:
              raise SystemExit(f'Expected one deferred-byte accounting anchor, found {build.count(accounting)}')
          build = build.replace(accounting, replacement, 1)

          declaration_comment = (
              '  // The Observatory adapter is emitted verbatim as its own asset and loaded after the page\'s load event by\n'
              '  // src/observatory-loader.js. It is an online-only control: not in the initial bundle, not in the offline shell.\n'
          )
          comment_replacement = declaration_comment + (
              '  // Discovery storage is likewise emitted as a deferred distribution asset. It remains unwired,\n'
              '  // so it is neither advertised by the initial bootstrap nor installed in the core offline shell.\n'
          )
          if build.count(declaration_comment) != 1:
              raise SystemExit('Expected the Observatory/deferred asset comment once')
          build = build.replace(declaration_comment, comment_replacement, 1)
          Path('tools/build.cjs').write_text(build, encoding='utf-8')

          browser = Path('tests/browser_discovery_storage.py')
          lines = browser.read_text(encoding='utf-8').splitlines(keepends=True)
          starts = [i for i, line in enumerate(lines) if '            lazy_asset = await page_a.evaluate(' in line]
          ends = [i for i, line in enumerate(lines) if '            lazy_url = URL + "/" + lazy_asset.removeprefix("./")' in line]
          if len(starts) != 1 or len(ends) != 1 or starts[0] >= ends[0]:
              raise SystemExit(f'Unexpected deferred browser block: starts={starts}, ends={ends}')
          replacement_lines = '''            lazy_assets = sorted(
                (ROOT / "dist" / "assets").glob("discovery-storage.*.js")
            )
            check(
                len(lazy_assets) == 1,
                "Exactly one hashed discovery CAS asset is emitted",
            )
            lazy_asset = "./assets/" + lazy_assets[0].name
            precached = await page_a.evaluate(
                """async (asset) => {
                  const response = await fetch('/sw.js', {cache: 'no-store'});
                  return (await response.text()).includes(asset);
                }""",
                lazy_asset,
            )
            check(
                not precached,
                "Unwired discovery CAS stays outside the core offline shell",
            )
            lazy_url = URL + "/" + lazy_asset.removeprefix("./")
'''.splitlines(keepends=True)
          lines[starts[0]:ends[0] + 1] = replacement_lines
          browser.write_text(''.join(lines), encoding='utf-8')

          budget = Path('tests/budget.test.cjs')
          source = budget.read_text(encoding='utf-8')
          anchor = "const info = JSON.parse(fs.readFileSync(path.join(root, 'build-info.json')));\n"
          if source.count(anchor) != 1:
              raise SystemExit(f'Expected one budget anchor, found {source.count(anchor)}')
          guard = """const assetNames = fs.readdirSync(path.join(root, 'dist/assets'));
          const initialScriptName = assetNames.find((name) => /^alibi\\.[a-f0-9]{12}\\.js$/.test(name));
          assert.ok(initialScriptName, 'Initial JavaScript is emitted');
          const initialScript = fs.readFileSync(
            path.join(root, 'dist/assets', initialScriptName),
            'utf8',
          );
          for (const globalName of [
            'ALIBI_HOUSE_CONFIG',
            'ALIBI_DELIVERY',
            'ALIBI_CURATION_MEDIA',
            'ALIBI_CONFIG',
            'ALIBI_QUIET_CONFIG',
            'ALIBI_MEDIA',
            'ALIBI_WORKER_URL',
            'ALIBI_CLUB_CONFIG',
            'ALIBI_OBSERVATORY_URL',
          ])
            assert.ok(
              initialScript.includes(`globalThis.${globalName}=`),
              `${globalName} remains in the initial configuration preamble`,
            );
          assert.ok(
            !initialScript.includes('ALIBI_DISCOVERY_STORAGE_URL'),
            'Unwired discovery storage stays out of the initial JavaScript',
          );
          const discoveryAssets = assetNames.filter((name) =>
            /^discovery-storage\\.[a-f0-9]{12}\\.js$/.test(name),
          );
          assert.equal(discoveryAssets.length, 1, 'One hashed discovery storage asset is emitted');
          const serviceWorker = fs.readFileSync(path.join(root, 'dist/sw.js'), 'utf8');
          assert.ok(
            !serviceWorker.includes(`./assets/${discoveryAssets[0]}`),
            'Unwired discovery storage stays outside the core offline shell',
          );
          """
          budget.write_text(source.replace(anchor, anchor + guard, 1), encoding='utf-8')
          PY
          npx prettier --write tools/build.cjs tests/budget.test.cjs
          python -m py_compile tests/browser_discovery_storage.py
          node --check src/discovery-storage.js
          npm run format:check
          npm run build
          node --test tests/budget.test.cjs tests/discovery-entitlements.test.cjs tests/storage.test.cjs tests/sw.test.cjs
          ! grep -q "ALIBI_DISCOVERY_STORAGE_URL" tools/build.cjs
          git rm .github/workflows/repair-discovery-config.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/build.cjs tests/budget.test.cjs tests/browser_discovery_storage.py
          git commit -m "fix(discovery): preserve the release bootstrap contract"
          git push origin HEAD:feat/discovery-meta-cas-30
