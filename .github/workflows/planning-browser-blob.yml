name: Fixed planning browser blob
on:
  push:
    branches: [codex/346-348-planning-vaults]
    paths: [.github/workflows/planning-browser-blob.yml]
permissions:
  contents: write
jobs:
  blob:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 71d4cf6dad75fb993291ca1764d3481bd094f6a8
          persist-credentials: false
      - name: Verify the two fixed test-only replacements and upload one immutable blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,pathlib,urllib.request
          def blob(data): return hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
          data=pathlib.Path('tests/browser_challenges.py').read_bytes()
          assert blob(data)=='7170272c6a186337116e4ebd4d48e14368c0cdb8'
          value=data.decode()
          edits=[
            ("DATA = [item for name in ('classics', 'warehouse', 'reversi', 'borough') for item in json.loads((ROOT / 'content' / 'challenges' / f'{name}.json').read_text())['challenges']]", "PACKS = json.loads((ROOT / 'content/challenges/registry.json').read_text())['packs']\nDATA = [item for name in PACKS for item in json.loads((ROOT / 'content/challenges' / name).read_text())['challenges']]"),
            ("assert page.locator('[data-challenge-id]').count() == 59", "assert page.locator('[data-challenge-id]').count() == len(DATA)\n        assert set(page.locator('[data-challenge-id]').evaluate_all('(es) => es.map(e => e.dataset.challengeId)')) == set(BY_ID)")
          ]
          for old,new in edits:
              assert value.count(old)==1
              value=value.replace(old,new)
          data=value.encode()
          assert blob(data)=='c5259d6fb229bcdb59dc73bf5ba56b2b774530f6'
          request=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/Alibi/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request) as response: result=json.load(response)
          assert result['sha']=='c5259d6fb229bcdb59dc73bf5ba56b2b774530f6'
          print(result['sha'])
