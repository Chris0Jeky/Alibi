name: Verify escape-room rehearsal
on:
  pull_request:
    paths:
      - 'tools/escape-*.cjs'
      - 'tools/escape-ui/**'
      - 'tests/escape-*.test.cjs'
      - 'tests/fixtures/escape-room.cjs'
      - 'tests/browser_escape_rooms.py'
      - 'content/escape-rooms/**'
      - 'docs/escape-rooms/anthology-review.json'
      - '.github/workflows/escape-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: escape-rehearsal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  escape-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Preserve exact source and formatter diagnostics
        run: |
          mkdir -p test-results/escape-rehearsal/formatted/tools/escape-ui test-results/escape-rehearsal/formatted/tests/fixtures
          git rev-parse HEAD > test-results/escape-rehearsal/source-head.txt
          for file in tools/escape-*.cjs tools/escape-ui/*.js tools/escape-ui/*.css tests/escape-*.test.cjs tests/fixtures/escape-room.cjs; do
            npx prettier "$file" > "test-results/escape-rehearsal/formatted/$file"
          done
      - name: Test state, content, session, source binding and preview
        run: |
          set -o pipefail
          node --test tests/escape-*.test.cjs | tee test-results/escape-rehearsal/source-tests.log
      - name: Use Ubuntu sources for browser dependencies
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99alibi-ci-sources >/dev/null
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Generate the offline anthology and exercise every room
        run: |
          node tools/escape-preview.cjs test-results/escape-rehearsal/rooms-after-closing.html content/escape-rooms/tidekeeper-workshop.json content/escape-rooms/printmaker-cabinet.json content/escape-rooms/moonseed-conservatory.json content/escape-rooms/herbarium-lift.json content/escape-rooms/counterweight-loft.json content/escape-rooms/clockmaker-rehearsal.json > test-results/escape-rehearsal/models.json
          python tests/browser_escape_rooms.py
      - name: Check source formatting without modifying it
        run: npx prettier --check 'tools/escape-*.cjs' 'tools/escape-ui/*.js' 'tools/escape-ui/*.css' 'tests/escape-*.test.cjs' tests/fixtures/escape-room.cjs
      - name: Ensure audio validation tools
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
      - name: Full exact-head verification
        run: |
          set -o pipefail
          npm run verify | tee test-results/escape-rehearsal/full-verify.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: escape-rehearsal-${{ github.run_id }}
          path: test-results/escape-rehearsal/
          if-no-files-found: error
