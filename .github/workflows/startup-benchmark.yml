name: Disposable browser shard and dependency probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: Disposable probe (${{ matrix.slice }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slice: [serial, '1', '2', '3', '4', timeline]
    env:
      PYTHONUTF8: '1'
      PROBE_SLICE: ${{ matrix.slice }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify source and runner
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat /etc/os-release
          fc-match sans-serif
      - run: npm ci
      - run: npm run build:android
      - run: node tools/check-test-build.cjs
      - run: python -m pip install -r requirements-dev.txt
      - name: Install pinned browser without APT
        run: python -m playwright install chromium
      - name: Run unchanged origin commands
        if: matrix.slice != 'timeline'
        run: |
          node tools/ci-browser-origin-shadow.cjs "$PROBE_SLICE" > "$RUNNER_TEMP/commands.sh"
          SECONDS=0
          trap 'status=$?; printf "slice %s, source %s, elapsed %s seconds, exit %s\n" "$PROBE_SLICE" "$GITHUB_SHA" "$SECONDS" "$status" >> "$GITHUB_STEP_SUMMARY"' EXIT
          bash -e "$RUNNER_TEMP/commands.sh"
      - name: Run Timeline and cabinet UI journeys
        if: matrix.slice == 'timeline'
        run: |
          SECONDS=0
          trap 'status=$?; printf "slice %s, source %s, elapsed %s seconds, exit %s\n" "$PROBE_SLICE" "$GITHUB_SHA" "$SECONDS" "$status" >> "$GITHUB_STEP_SUMMARY"' EXIT
          python tests/browser_timeline_lab.py
          python tests/browser_ui.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: disposable-browser-probe-${{ matrix.slice }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
