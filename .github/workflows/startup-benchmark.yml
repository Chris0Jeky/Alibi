name: Disposable Ubuntu mirrors diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Test official Ubuntu mirror names independently
        run: |
          printf 'Diagnostic source %s\n' "$GITHUB_SHA"
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            printf '\n--- %s ---\n' "$host"
            getent ahostsv4 "$host" || printf 'DNS lookup failed\n'
            curl --silent --show-error --head --max-time 15 "https://$host/ubuntu/dists/noble/InRelease" || printf 'HTTPS request failed\n'
          done
