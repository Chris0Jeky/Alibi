name: Built-origin startup benchmark
on:
  pull_request:
    paths:
      - 'tools/ci-ubuntu-sources.sh'
      - 'tools/startup-fixture.cjs'
      - 'tests/browser_startup_benchmark.py'
      - 'tests/startup-fixture.test.cjs'
      - '.github/workflows/startup-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: node --test tests/startup-fixture.test.cjs
      - run: npm run build:web
      - run: python -m pip install -r requirements-dev.txt
      - name: Use Ubuntu repositories for Chromium system dependencies
        run: bash tools/ci-ubuntu-sources.sh
      - name: Install Chromium with a bounded setup phase
        run: node tools/ci-setup-phase.cjs --phase startup-chromium --timeout-seconds 480 --grace-seconds 20 -- python -m playwright install --with-deps chromium
      - name: Measure synthetic saved runs through real IndexedDB
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm start > /tmp/alibi-startup-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8797/ > /dev/null && break
            sleep 1
          done
          python tests/browser_startup_benchmark.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: startup-benchmark-evidence
          path: test-results/startup-benchmark/
          if-no-files-found: warn
          retention-days: 14
