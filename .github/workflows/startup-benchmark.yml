name: Disposable Ubuntu mirror DNS probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve and reach Ubuntu mirror
        run: |
          printf 'Source %s\n' "$GITHUB_SHA"
          getent ahostsv4 azure.archive.ubuntu.com
          curl --fail --silent --show-error --head --max-time 20 http://azure.archive.ubuntu.com/ubuntu/dists/noble/InRelease
