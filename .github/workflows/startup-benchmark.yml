name: Disposable Playwright dependency probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Record runner and source
        run: |
          git rev-parse HEAD
          cat /etc/os-release
          fc-match sans-serif
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-dev.txt
      - name: Install pinned browser without APT
        run: python -m playwright install chromium
      - name: Launch pinned browser
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.set_content('<h1>Browser dependency probe</h1>')
              assert page.locator('h1').inner_text() == 'Browser dependency probe'
              print('Playwright Chromium launched:', browser.version)
              browser.close()
          PY
      - name: Run unchanged real-origin suite
        run: |
          npm start > /tmp/alibi-probe-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8797/ >/dev/null && break; sleep 1; done
          python tests/browser_origin.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: disposable-playwright-probe
          path: test-results/browser-origin/
          if-no-files-found: ignore
          retention-days: 3
