name: Disposable signed Ubuntu mirror probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Configure signed Ubuntu country mirror in this disposable runner
        run: |
          cat > /tmp/alibi-ubuntu-probe.sources <<'SOURCES'
          Types: deb
          URIs: https://mirrors.nic.funet.fi/ubuntu
          Suites: noble noble-updates noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          printf '%s\n' 'Dir::Etc::sourcelist "/tmp/alibi-ubuntu-probe.sources";' 'Dir::Etc::sourceparts "-";' 'Acquire::Retries "0";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' 'APT::Update::Error-Mode "any";' | sudo tee /etc/apt/apt.conf.d/99alibi-probe >/dev/null
          sudo apt-get update
      - name: Install emulator library with signed APT
        run: |
          sudo apt-get install --yes --no-install-recommends libpulse0
          ldconfig -p | grep -F 'libpulse.so.0'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install pinned Playwright and its full system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Launch pinned Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              print('Pinned Chromium launched:', browser.version)
              browser.close()
          PY
