name: Disposable pinned Playwright image probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Record source and image fonts
        run: |
          git rev-parse HEAD
          cat /etc/os-release
          node --version
          python --version
          command -v ffmpeg || true
          ldconfig -p | grep -F 'libpulse.so.0' || true
          fc-list | wc -l
          fc-match sans-serif
          fc-match 'Noto Color Emoji'
      - run: npm ci
      - run: npm run build:android
      - run: node tools/check-test-build.cjs
      - run: python -m pip install -r requirements-dev.txt
      - name: Launch image Chromium and run Timeline UI
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              print('Pinned Chromium launched:', browser.version)
              browser.close()
          PY
          python tests/browser_timeline_lab.py
          python tests/browser_ui.py
      - name: Run unchanged real-origin suite
        run: |
          npm start > /tmp/alibi-image-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8797/ >/dev/null && break; sleep 1; done
          python tests/browser_origin.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b488f43607fa02
        if: always()
        with:
          name: disposable-playwright-image-probe
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
