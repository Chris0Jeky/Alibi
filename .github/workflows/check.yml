name: Verify puzzle cabinet
on:
  # PR branches validate via pull_request only. A bare push trigger used to
  # fire a second full run on the same SHA (issue #242).
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      ALIBI_EVENT_NAME: ${{ github.event_name }}
      ALIBI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      ALIBI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Classify verification scope
        id: scope
        run: node tools/ci-scope.cjs
      - name: Verify publication and provenance documents
        if: steps.scope.outputs.mode == 'publication-docs'
        run: node tools/ci-scope.cjs --verify-docs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.scope.outputs.mode == 'full'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
        if: steps.scope.outputs.mode == 'full'
      - name: Use Ubuntu repositories for CI system dependencies
        if: steps.scope.outputs.mode == 'full'
        run: |
          # FFmpeg and Playwright's Linux dependencies come from Ubuntu. The
          # runner's unrelated Chrome feed can have inconsistent package indexes.
          # Apply this to the whole job, including Playwright's later apt calls.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' \
            'Dir::Etc::sourceparts "-";' \
            | sudo tee /etc/apt/apt.conf.d/99alibi-ci-sources >/dev/null
      - name: Ensure audio asset validation tools are available
        if: steps.scope.outputs.mode == 'full'
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffprobe -version
      - run: npm run verify
        if: steps.scope.outputs.mode == 'full'
      - run: node observatory/check.mjs
        if: steps.scope.outputs.mode == 'full'
      - run: node tools/verify-curation.cjs
        if: steps.scope.outputs.mode == 'full'
      - run: node tools/curation/replay_challenges.cjs src/quiet-wing/engine.js src/club-engines.js test-results/challenges-replay.json
        if: steps.scope.outputs.mode == 'full'
      - run: npm run assets:media
        if: steps.scope.outputs.mode == 'full'
      - run: python -m pip install -r requirements-dev.txt
        if: steps.scope.outputs.mode == 'full'
      - run: python tools/assets/inspect-media.py
        if: steps.scope.outputs.mode == 'full'
      - run: python -m playwright install --with-deps chromium
        if: steps.scope.outputs.mode == 'full'
      - run: python tests/browser_ui.py
        if: steps.scope.outputs.mode == 'full'
      - run: ALIBI_CURATION_UI=1 ALIBI_UI_WIDTH=390 python tests/browser_ui.py
        if: steps.scope.outputs.mode == 'full'
      - run: ALIBI_CURATION_UI=1 ALIBI_UI_WIDTH=1280 python tests/browser_ui.py
        if: steps.scope.outputs.mode == 'full'
      - name: Play all After Hours games and reversible assistance
        if: steps.scope.outputs.mode == 'full'
        run: python tests/browser_club.py
      - name: Exercise real IndexedDB and offline play
        if: steps.scope.outputs.mode == 'full'
        run: |
          npm start > /tmp/alibi-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8787/ > /dev/null && break; sleep 1; done
          python tests/browser_origin.py
          python tests/browser_observatory.py
          python tests/browser_curation.py
          python tests/browser_discovery.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_discovery_storage.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_narrow_layout.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_library_focus.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_quiet_focus.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_quiet_motion.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_player_qa.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_mobile_qa.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_september_feedback.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_tic_tac_toe.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_large_nonogram.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_expert_sudoku.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_block_cabinet.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_block_motion.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_region_gardens.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_invitation.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_dominoes.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_expert_families.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_expert_aquarium.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_expert_nonogram.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_expert_controls.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_mahjong.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_feedback_discovery.py
          python tests/browser_delivery.py
          python tests/browser_theatre.py
          ALIBI_URL8795=http://127.0.0.1:8787/ python tests/browser_challenges.py
          python tests/browser_restart.py
          python tests/browser_boot.py
          python tests/browser_quiet.py
          python tests/browser_city.py
          python tests/browser_city_gpu.py
          python tests/browser_companions.py
          python tests/browser_calm.py
          python tests/browser_garden.py
          python tests/browser_atmosphere.py
          python tests/browser_quiet_origin.py
          python tests/browser_backup_worker.py
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_backup_import.py
          node tools/serve-assets.cjs > /tmp/alibi-assets.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8790/ > /dev/null && break; sleep 1; done
          python tests/browser_assets.py
          python tests/browser_model_assets.py
          python tests/browser_asset_media.py
          python tests/browser_experience.py
      - name: Play the Bellweather expedition and Bridges on mobile
        if: steps.scope.outputs.mode == 'full'
        run: python tests/browser_expedition.py
      - name: Verify an in-progress game survives a release update
        if: steps.scope.outputs.mode == 'full'
        run: python tests/browser_update.py
      - name: Exercise optional rooms in the local Cloudflare runtime
        if: steps.scope.outputs.mode == 'full'
        run: |
          npx wrangler dev --local --config optional-online/wrangler.jsonc --port 8788 --var RATE_SALT:local-test-salt-not-a-production-secret --var DEV_LOCAL:true > /tmp/alibi-rooms.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8788/api/health > /dev/null && break; sleep 1; done
          python tests/browser_rooms.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.scope.outputs.mode == 'full'
        with:
          name: alibi-release-and-evidence
          path: |
            alibi-deluxe-cloudflare.zip
            build-info.json
            tests/*-results.json
            tests/quiet-wing/*-results.json
            tests/screenshots/
            test-results/browser-origin/*.json
            test-results/browser-backup-import.json
            test-results/browser-update/*.json
            test-results/mobile-qa/
            test-results/browser-expedition/**/*.json
            test-results/browser-expedition/**/*.png
            test-results/*.png
            test-results/afterhours-club/
            test-results/browser-restart/
            test-results/browser-rooms/
            test-results/browser-boot/
            test-results/quiet-wing/
            test-results/atmosphere/
            test-results/curation-ui/
            test-results/discovery/
            test-results/discovery-storage/
            test-results/edge-layout/
            test-results/library-focus/
            test-results/quiet-focus/
            test-results/delivery/
            test-results/theatre/
            test-results/curation-check/
            test-results/challenges-replay.json
            test-results/large-nonogram/
            test-results/expert-browser/
            test-results/expert-control/
            test-results/expert-nonogram/
            test-results/tic-tac-toe/
            test-results/player-qa/
            test-results/feedback-discovery/
            test-results/september-feedback/
            test-results/block-motion/
          retention-days: 14
