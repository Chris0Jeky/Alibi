name: Publish verified coordinate blobs
on:
  push:
    branches: [codex/binary-reasoning-hints]
permissions:
  contents: read
jobs:
  source-blobs:
    if: github.repository == 'Chris0Jeky/Alibi' && github.ref == 'refs/heads/codex/binary-reasoning-hints' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify fixed inputs and publish immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          parent = '3d6c0ba2a29629b8005c71dbffcf6ca992981fff'
          expected = {
              'assets-source/library/catalogue.json': '34602f829ac8b6ce69c7b7c5747877a55bb756ea',
              'src/app.js': '9b7e0915138824f6709c2c48281628f7097e592a',
              'src/assist.js': '5e60d7c96ad7ee1f3363af3d1d37723386c2b277',
              'src/bridges.js': '31227b442156b4db46e171ee9ec92f895265449c',
              'src/core.js': '7223bc01516e277be0d413018d52f38c16af2eea',
              'src/insights.js': 'a447102934aaee81bf213306fd9d2196e1d5b73a',
              'tests/cell-coordinate.test.cjs': 'eb30352625c958ebcc640aa672e42bdcb9bb11ba',
          }
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert os.environ['GITHUB_REPOSITORY'] == 'Chris0Jeky/Alibi'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/binary-reasoning-hints'
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD^') == parent
          assert git('diff', '--name-only', parent, 'HEAD') == '.github/workflows/check.yml'
          payload = ''
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '19c6b1d06eea885b8c3d8f9c2d49f110d71620f2300638c5dbfd896e43ce7136'
          patch_file = pathlib.Path('/tmp/alibi-coordinate-maintenance.patch')
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', str(patch_file)], check=True)
          # Verify every output before the first API write. No repository code executes.
          for path, sha in expected.items():
              assert git('hash-object', path) == sha, path
          changed = set(git('diff', '--name-only').splitlines())
          changed.update(git('ls-files', '--others', '--exclude-standard').splitlines())
          assert changed == set(expected), changed
          subprocess.run(['git', 'diff', '--check'], check=True)
          # Only create immutable blobs; never commit, move a branch, merge or deploy.
          # The connected maintainer will restore the ordinary workflow in an atomic commit.
          endpoint = 'https://api.github.com/repos/Chris0Jeky/Alibi/git/blobs'
          for path, sha in expected.items():
              data = json.dumps({'content': base64.b64encode(pathlib.Path(path).read_bytes()).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request(endpoint, data=data, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == sha, path
              print(path + ' ' + sha, flush=True)
          print('Verified seven source blobs. No ref, commit, merge or deployment mutation.', flush=True)
          PY
