name: Verify puzzle cabinet
on:
  # PR branches validate via pull_request only. A bare push trigger used to
  # fire a second full run on the same SHA (issue #242).
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Main runs get a per-commit group: a later docs-only push must not cancel a full run.
  group: verify-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  ALIBI_EVENT_NAME: ${{ github.event_name }}
  ALIBI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  ALIBI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    # The full gate keeps 45 minutes of runner time on its longest path (10 + 32 + 3).
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      source: ${{ steps.source.outputs.identity }}
      docs-verified: ${{ steps.docs.outputs.verified }}
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and record the event source
        id: source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$ALIBI_EVENT_NAME" == pull_request ]]; then
            test "$(git show -s --format=%P HEAD)" = "$ALIBI_BASE_SHA $ALIBI_HEAD_SHA"
          fi
          printf 'identity=%s:%s:%s\n' "$GITHUB_SHA" "$ALIBI_HEAD_SHA" "$ALIBI_BASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Classify verification scope
        id: scope
        run: node tools/ci-scope.cjs
      - name: Verify publication and provenance documents
        id: docs
        if: steps.scope.outputs.mode == 'publication-docs'
        run: |
          node tools/ci-scope.cjs --verify-docs
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"
      - run: node --test tests/ci-shadow/browser-origin.test.cjs
        if: steps.scope.outputs.mode == 'full'
      - run: npm ci
        if: steps.scope.outputs.mode == 'full'
      - run: npm run format:check
        if: steps.scope.outputs.mode == 'full'
      - run: npm run build:android
        if: steps.scope.outputs.mode == 'full'
      - name: Package the exact web and Android test build
        id: archive
        if: steps.scope.outputs.mode == 'full'
        run: |
          node tools/check-test-build.cjs
          archive="$RUNNER_TEMP/alibi-cabinet.tar.gz"
          tar -czf "$archive" dist dist-android build-info.json alibi-deluxe-play.html alibi-deluxe-cloudflare.zip
          read -r digest _ < <(sha256sum "$archive")
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Share the test build within this run
        id: upload
        if: steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alibi-cabinet-build-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alibi-cabinet.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  cabinet:
    needs: prepare
    if: needs.prepare.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    outputs:
      receipt: ${{ steps.receipt.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - name: Restore the verified cabinet build
        uses: ./.github/actions/restore-cabinet-build
        with:
          artifact-id: ${{ needs.prepare.outputs.artifact-id }}
          sha256: ${{ needs.prepare.outputs.archive-sha256 }}
      - name: Verify bounded setup and diagnostic redaction before provisioning
        run: |
          node --test tests/ci-setup-phase.test.cjs
          python tests/test_ci_audio_dependencies.py
          python tests/test_ci_ubuntu_sources.py
      - name: Use Ubuntu repositories for CI system dependencies
        run: bash tools/ci-ubuntu-sources.sh
      - name: Prepare audio archive cache key
        id: audio-cache-key
        run: |
          . /etc/os-release
          echo "prefix=alibi-apt-${ID}-${VERSION_ID}-${RUNNER_ARCH}-ffmpeg-v1-" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/alibi-audio-apt-archives
      - name: Restore audio package archives
        id: audio-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/alibi-audio-apt-archives
          key: ${{ steps.audio-cache-key.outputs.prefix }}${{ steps.audio-cache-key.outputs.week }}
          restore-keys: ${{ steps.audio-cache-key.outputs.prefix }}
      - name: Ensure audio asset validation tools are available
        run: |
          node tools/ci-setup-phase.cjs --phase audio-dependencies --timeout-seconds 480 --grace-seconds 20 -- bash tools/ci-audio-dependencies.sh /tmp/alibi-audio-apt-archives
      - name: Prepare audio archives for saving
        if: steps.audio-cache.outputs.cache-hit != 'true'
        id: audio-cache-save
        run: |
          # Partial downloads and lock files are not cached; only completed .debs.
          sudo rm -rf /tmp/alibi-audio-apt-archives/partial
          sudo rm -f /tmp/alibi-audio-apt-archives/lock
          if compgen -G '/tmp/alibi-audio-apt-archives/*.deb' > /dev/null; then
            echo 'populated=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save audio package archives
        if: steps.audio-cache.outputs.cache-hit != 'true' && steps.audio-cache-save.outputs.populated == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/alibi-audio-apt-archives
          key: ${{ steps.audio-cache-key.outputs.prefix }}${{ steps.audio-cache-key.outputs.week }}
      - run: npm test
      - run: node observatory/check.mjs
      - run: node tools/verify-curation.cjs
      - run: node tools/curation/replay_challenges.cjs src/quiet-wing/engine.js src/club-engines.js test-results/challenges-replay.json
      - run: npm run assets:media
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/assets/inspect-media.py
      - name: Install Chromium and its system dependencies
        run: node tools/ci-setup-phase.cjs --phase playwright-chromium --timeout-seconds 480 --grace-seconds 20 -- python -m playwright install --with-deps chromium
      - run: python tests/browser_ui.py
      - run: python tests/browser_pause_focus.py
      - name: Verify phone and desktop pictogram navigation
        run: python tests/browser_club_pictograms.py
      - run: python tests/browser_keyboard_help.py
      - run: python tests/browser_tool_focus.py
      - run: python tests/browser_favorite_focus.py
      - run: python tests/browser_save_error_controls.py
      - run: python tests/browser_paint_render.py
      - run: python tests/browser_note_digit_repeat.py
      - run: python tests/browser_pencil_repeat.py
      - run: python tests/browser_escape_repeat.py
      - run: python tests/browser_clue_favorite_repeat.py
      - run: ALIBI_CURATION_UI=1 ALIBI_UI_WIDTH=390 python tests/browser_ui.py
      - run: ALIBI_CURATION_UI=1 ALIBI_UI_WIDTH=1280 python tests/browser_ui.py
      - name: Play all After Hours games and reversible assistance
        run: python tests/browser_club.py
      - name: Verify Club storage fallback in a browser
        run: python tests/browser_club_fallback.py
      - name: Play the Archive Heist vault rooms on a local origin
        run: python tests/browser_archive_vaults.py
      - name: Play the Bellweather expedition and Bridges on mobile
        run: |
          node tools/ci-browser-origin-shadow.cjs server > "$RUNNER_TEMP/alibi-origin-server.sh"
          bash -e "$RUNNER_TEMP/alibi-origin-server.sh"
          python tests/browser_expedition.py
      - name: Verify an in-progress game survives a release update
        run: python tests/browser_update.py
      - name: Exercise optional rooms in the local Cloudflare runtime
        run: |
          npx wrangler dev --local --config optional-online/wrangler.jsonc --port 8788 --var RATE_SALT:local-test-salt-not-a-production-secret --var DEV_LOCAL:true > /tmp/alibi-rooms.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8788/api/health > /dev/null && break; sleep 1; done
          python tests/browser_rooms.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: alibi-release-and-evidence${{ github.run_attempt != '1' && format('-attempt-{0}', github.run_attempt) || '' }}
          path: |
            alibi-deluxe-cloudflare.zip
            build-info.json
            tests/*-results.json
            tests/quiet-wing/*-results.json
            tests/screenshots/
            test-results/browser-origin/*.json
            test-results/workshop-ownership/
            test-results/backup-ownership/
            test-results/completion-hooks/
            test-results/browser-backup-import.json
            test-results/browser-update/*.json
            test-results/mobile-qa/
            test-results/browser-expedition/**/*.json
            test-results/browser-expedition/**/*.png
            test-results/*.png
            test-results/afterhours-club/
            test-results/club-pictograms/
            test-results/browser-restart/
            test-results/browser-rooms/
            test-results/browser-boot/
            test-results/quiet-wing/
            test-results/atmosphere/
            test-results/curation-ui/
            test-results/discovery/
            test-results/discovery-storage/
            test-results/edge-layout/
            test-results/library-focus/
            test-results/quiet-focus/
            test-results/delivery/
            test-results/theatre/
            test-results/curation-check/
            test-results/challenges-replay.json
            test-results/challenge-library/
            test-results/challenge-lifecycle/
            test-results/large-nonogram/
            test-results/expert-browser/
            test-results/expert-control/
            test-results/expert-nonogram/
            test-results/tic-tac-toe/
            test-results/player-qa/
            test-results/feedback-discovery/
            test-results/september-feedback/
            test-results/block-motion/
          retention-days: 14
      - name: Record successful cabinet verification
        id: receipt
        env:
          BUILD_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
        run: printf 'value=%s:%s:%s:cabinet\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$BUILD_SHA256" >> "$GITHUB_OUTPUT"
  origin-1:
    needs: prepare
    if: needs.prepare.outputs.mode == 'full'
    uses: ./.github/workflows/browser-origin-ci.yml
    with:
      slice: '1'
      artifact-id: ${{ needs.prepare.outputs.artifact-id }}
      archive-sha256: ${{ needs.prepare.outputs.archive-sha256 }}
  origin-2:
    needs: prepare
    if: needs.prepare.outputs.mode == 'full'
    uses: ./.github/workflows/browser-origin-ci.yml
    with:
      slice: '2'
      artifact-id: ${{ needs.prepare.outputs.artifact-id }}
      archive-sha256: ${{ needs.prepare.outputs.archive-sha256 }}
  origin-3:
    needs: prepare
    if: needs.prepare.outputs.mode == 'full'
    uses: ./.github/workflows/browser-origin-ci.yml
    with:
      slice: '3'
      artifact-id: ${{ needs.prepare.outputs.artifact-id }}
      archive-sha256: ${{ needs.prepare.outputs.archive-sha256 }}
  origin-4:
    needs: prepare
    if: needs.prepare.outputs.mode == 'full'
    uses: ./.github/workflows/browser-origin-ci.yml
    with:
      slice: '4'
      artifact-id: ${{ needs.prepare.outputs.artifact-id }}
      archive-sha256: ${{ needs.prepare.outputs.archive-sha256 }}
  verify:
    if: ${{ always() }}
    needs: [prepare, cabinet, origin-1, origin-2, origin-3, origin-4]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Require each verification result
        if: ${{ always() }}
        env:
          ALIBI_NEEDS: ${{ toJSON(needs) }}
          ALIBI_CANCELLED: ${{ cancelled() }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node tools/ci-required-gate.cjs
