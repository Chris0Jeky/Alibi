name: Repair CI scope review findings
on:
  push:
    branches:
      - ci/publication-receipt-fast-path-149
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ci/publication-receipt-fast-path-149
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Add bypass regressions and prove they fail
        run: |
          python - <<'PY'
          from pathlib import Path

          filename = Path('tests/ci-scope.test.cjs')
          text = filename.read_text()
          marker = "test('comparison environment accepts real non-zero SHAs only', () => {"
          regression = r'''test('literal backslashes never alias allowlisted Git paths', () => {
            assert.equal(normalizePath('docs\\STATE.md'), null);
            assert.equal(classifyPaths(['docs\\STATE.md']).mode, 'full');
          });

          test('publication verification validates reference-style link definitions', () => {
            const valid = fixture({
              'docs/STATE.md': '# State\nSee [release][details].\n\n[details]: RELEASE-0.11.3.md\n',
              'docs/RELEASE-0.11.3.md': '# Release\n',
            });
            assert.deepEqual(verifyDocuments(valid, ['docs/STATE.md']), []);

            const broken = fixture({
              'docs/STATE.md': '# State\nSee [receipt][missing].\n\n[missing]: missing.md\n',
            });
            assert.match(
              verifyDocuments(broken, ['docs/STATE.md']).join('\n'),
              /missing local target/,
            );
          });

          '''.replace('          ', '')
          if marker not in text:
              raise SystemExit('Test insertion marker not found.')
          filename.write_text(text.replace(marker, regression + marker))
          PY
          if node --test --test-name-pattern='backslashes|reference-style' tests/ci-scope.test.cjs; then
            echo 'Bypass regressions unexpectedly passed before the implementation change.' >&2
            exit 1
          fi
      - name: Reject aliases and validate reference definitions
        run: |
          python - <<'PY'
          from pathlib import Path

          filename = Path('tools/ci-scope.cjs')
          text = filename.read_text()
          text = text.replace(
              "const LINK = /!?\\[[^\\]]*\\]\\(([^)]+)\\)/g;",
              "const LINK = /!?\\[[^\\]]*\\]\\(([^)]+)\\)/g;\nconst REFERENCE_LINK = /^[ \\t]{0,3}\\[[^\\]\\r\\n]+\\]:[ \\t]*(?:<([^>\\r\\n]+)>|(\\S+))/gm;",
          )
          old_normalize = """function normalizePath(value) {
            if (typeof value !== 'string' || value.length === 0 || value.includes('\\0')) return null;
            const normalized = value.replaceAll('\\\\', '/').replace(/^\\.\\//, '');
          """.replace('          ', '')
          new_normalize = """function normalizePath(value) {
            if (
              typeof value !== 'string' ||
              value.length === 0 ||
              value.includes('\\0') ||
              value.includes('\\\\')
            )
              return null;
            const normalized = value.replace(/^\\.\\//, '');
          """.replace('          ', '')
          if old_normalize not in text:
              raise SystemExit('normalizePath replacement marker not found.')
          text = text.replace(old_normalize, new_normalize)

          old_loop = r'''  const visible = stripCode(text);
            for (const match of visible.matchAll(LINK)) {
              const target = linkTarget(match[1]);
              if (!target || target.startsWith('#')) continue;
              if (/^https:\/\//i.test(target) || /^mailto:/i.test(target)) continue;
              if (/^[a-z][a-z0-9+.-]*:/i.test(target)) {
                errors.push(`${normalized} uses a non-HTTPS or unsupported link: ${target}.`);
                continue;
              }
              let decoded;
              try {
                decoded = decodeURIComponent(target.split('#')[0]);
              } catch {
                errors.push(`${normalized} contains an invalid encoded link: ${target}.`);
                continue;
              }
              if (!decoded) continue;
              const resolved = path.resolve(path.dirname(real), decoded);
              if (!resolved.startsWith(repository + path.sep) || !fs.existsSync(resolved)) {
                errors.push(`${normalized} links to a missing local target: ${target}.`);
                continue;
              }
              if (!fs.realpathSync(resolved).startsWith(repository + path.sep)) {
                errors.push(`${normalized} links outside the repository: ${target}.`);
              }
            }
          '''.replace('          ', '')
          new_loop = r'''  const visible = stripCode(text);
            function validateLink(raw) {
              const target = linkTarget(raw);
              if (!target || target.startsWith('#')) return;
              if (/^https:\/\//i.test(target) || /^mailto:/i.test(target)) return;
              if (/^[a-z][a-z0-9+.-]*:/i.test(target)) {
                errors.push(`${normalized} uses a non-HTTPS or unsupported link: ${target}.`);
                return;
              }
              let decoded;
              try {
                decoded = decodeURIComponent(target.split('#')[0]);
              } catch {
                errors.push(`${normalized} contains an invalid encoded link: ${target}.`);
                return;
              }
              if (!decoded) return;
              const resolved = path.resolve(path.dirname(real), decoded);
              if (!resolved.startsWith(repository + path.sep) || !fs.existsSync(resolved)) {
                errors.push(`${normalized} links to a missing local target: ${target}.`);
                return;
              }
              if (!fs.realpathSync(resolved).startsWith(repository + path.sep)) {
                errors.push(`${normalized} links outside the repository: ${target}.`);
              }
            }
            for (const match of visible.matchAll(LINK)) validateLink(match[1]);
            for (const match of visible.matchAll(REFERENCE_LINK)) validateLink(match[1] || match[2]);
          '''.replace('          ', '')
          if old_loop not in text:
              raise SystemExit('Link validation replacement marker not found.')
          filename.write_text(text.replace(old_loop, new_loop))
          PY
          node --test tests/ci-scope.test.cjs
          npx prettier --write tools/ci-scope.cjs tests/ci-scope.test.cjs
          node --test tests/ci-scope.test.cjs
          git diff --check
      - name: Commit reviewed CI hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/ci-scope.cjs tests/ci-scope.test.cjs
          git commit -m "fix(ci): close publication fast-path aliases"
          git push
