name: Format storage precision correction

on:
  push:
    branches:
      - fix/cabinet-revision-precision
    paths:
      - src/storage.js
      - .github/workflows/format-storage-precision.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/cabinet-revision-precision
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/storage.js
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/storage.js; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/storage.js
          git commit -m "style(storage): format revision guard"
          git push origin HEAD:fix/cabinet-revision-precision
