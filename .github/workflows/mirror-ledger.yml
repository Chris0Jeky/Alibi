name: Mirror Ledger prototype
on:
  push:
    branches: [main]
    paths:
      [
        'tools/ci-ubuntu-sources.sh',
        '.github/workflows/mirror-ledger.yml',
        'prototypes/mirror-ledger/**',
        'tests/mirror-ledger.test.mjs',
        'tests/browser_mirror_ledger.py',
        'requirements-dev.txt',
        'tools/ci-setup-phase.cjs',
        'tools/build-mirror-preview.cjs',
        'package.json',
        'package-lock.json',
      ]
  pull_request:
    branches: [main]
    paths:
      [
        'tools/ci-ubuntu-sources.sh',
        '.github/workflows/mirror-ledger.yml',
        'prototypes/mirror-ledger/**',
        'tests/mirror-ledger.test.mjs',
        'tests/browser_mirror_ledger.py',
        'requirements-dev.txt',
        'tools/ci-setup-phase.cjs',
        'tools/build-mirror-preview.cjs',
        'package.json',
        'package-lock.json',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: node --test tests/mirror-ledger.test.mjs
      - run: node tools/build-mirror-preview.cjs
      - run: python -m pip install -r requirements-dev.txt
      - name: Use Ubuntu repositories for Chromium system dependencies
        run: bash tools/ci-ubuntu-sources.sh
      - name: Install Chromium and system dependencies
        run: node tools/ci-setup-phase.cjs --phase mirror-chromium --timeout-seconds 480 --grace-seconds 20 -- python -m playwright install --with-deps chromium
      - run: python tests/browser_mirror_ledger.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mirror-ledger-browser-evidence
          path: test-results/mirror-ledger/
          if-no-files-found: warn
