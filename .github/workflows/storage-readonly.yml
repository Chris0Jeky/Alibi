name: Cabinet read-only fallback
on:
  pull_request:
    paths:
      - 'src/storage.js'
      - 'src/core.js'
      - 'src/app.js'
      - 'tools/build*.cjs'
      - 'tests/storage*.test.cjs'
      - 'tests/browser_storage_readonly.py'
      - '.github/workflows/storage-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-readonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storage-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record immutable source inputs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p test-results/storage-readonly
          printf '{"sourceSha":"%s","treeSha":"%s"}\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > test-results/storage-readonly/source-head.json
          git archive --format=tar --prefix=source/ HEAD | gzip -n > test-results/storage-readonly/source.tar.gz
          sha256sum src/storage.js src/core.js src/app.js tests/storage.test.cjs tests/storage-readonly.test.cjs tests/browser_storage_readonly.py > test-results/storage-readonly/inputs.sha256
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Source policy and existing storage contracts
        run: |
          set -o pipefail
          node --test tests/storage-readonly.test.cjs tests/storage.test.cjs tests/storage-revision.test.cjs tests/storage-restore.test.cjs tests/recovery.test.cjs tests/save-update.test.cjs 2>&1 | tee test-results/storage-readonly/source-tests.log
      - run: npm ci
        id: dependencies
        if: ${{ !cancelled() }}
      - name: Required pinned formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee test-results/storage-readonly/format.log
      - name: Preserve formatter proposals without modifying tested files
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const prettier = require('prettier');
          (async () => {
            for (const file of ['src/storage.js', 'tests/storage.test.cjs', 'tests/storage-readonly.test.cjs']) {
              const options = await prettier.resolveConfig(file);
              const formatted = await prettier.format(fs.readFileSync(file, 'utf8'), { ...options, filepath: file });
              fs.writeFileSync(path.join('test-results/storage-readonly', path.basename(file) + '.formatted'), formatted);
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Build both targets with unchanged byte ceilings
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run build:android 2>&1 | tee test-results/storage-readonly/build.log
      - name: All Node and Quiet Wing tests including unchanged budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results/storage-readonly/full-tests.log
      - run: python -m pip install -r requirements-dev.txt
        id: python-dependencies
        if: ${{ !cancelled() }}
      - name: Install Chromium using Ubuntu package sources
        id: browser-install
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' }}
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99alibi-ci-sources >/dev/null
          python -m playwright install --with-deps chromium
      - name: Native policy and actual emitted-app export controls
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          python tests/browser_storage_readonly.py 2>&1 | tee test-results/storage-readonly/browser.log
      - name: Ensure evidence did not rewrite source
        if: ${{ !cancelled() }}
        run: |
          sha256sum --check test-results/storage-readonly/inputs.sha256
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-readonly-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/storage-readonly/
            build-info.json
          retention-days: 14
          if-no-files-found: error
