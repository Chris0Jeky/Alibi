name: Apply witness solver review fix

on:
  push:
    branches:
      - feat/explicit-solver-contract-3
    paths:
      - .github/workflows/pr-155-witness-fix.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/explicit-solver-contract-3
          fetch-depth: 0
      - name: Apply exact witness-state constraint fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/engines.js')
          text = path.read_text()
          old = """        if (\n          p.statements.filter((c) => truth(c, i)).length === p.trueCount &&\n          (state?.accused == null || state.accused === i)\n        )\n          add(i);\n"""
          new = """        if (\n          p.statements.filter((c) => truth(c, i)).length === p.trueCount &&\n          (state?.accused == null || state.accused === i) &&\n          (state?.marks == null ||\n            state.marks.every(\n              (mark, statement) =>\n                mark === -1 || mark === Number(truth(p.statements[statement], i)),\n            ))\n        )\n          add(i);\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one witness solver target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/pr-155-witness-fix.yml
      - name: Commit reviewed implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engines.js .github/workflows/pr-155-witness-fix.yml
          git commit -m "fix(core): honor witness statement state constraints"
          git push origin HEAD:feat/explicit-solver-contract-3
