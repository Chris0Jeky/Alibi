name: Temporary storage format probe
on:
  push:
    branches:
      - feat/discovery-meta-cas-30
permissions:
  contents: write
concurrency:
  group: format-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/discovery-meta-cas-30
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply canonical storage source
        run: |
          npx prettier --write src/storage.js
          if git diff --quiet -- src/storage.js; then
            echo "Storage source already formatted."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/storage.js
          git commit -m "style(storage): apply canonical formatter output"
          git push origin HEAD:feat/discovery-meta-cas-30
