name: Format budget accounting

on:
  push:
    branches:
      - test/core-offline-budget-accounting

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/budget.test.cjs
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- tests/budget.test.cjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/budget.test.cjs
          git commit -m "style(tests): format offline budget accounting"
          git push origin HEAD:test/core-offline-budget-accounting
