name: Apply lazy discovery storage build wiring
on:
  push:
    branches:
      - feat/discovery-meta-cas-30
permissions:
  contents: write
concurrency:
  group: discovery-storage-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/discovery-meta-cas-30
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Patch the reproducible build
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/build.cjs')
          source = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one build fragment, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          replace_once(
              """  const observatory = read(path.join(ROOT, 'observatory/browser.js')),
              observatoryURL = `./assets/observatory.${hash(observatory)}.js`;
            write(path.join(DIST, observatoryURL), observatory);
          """,
              """  const observatory = read(path.join(ROOT, 'observatory/browser.js')),
              observatoryURL = `./assets/observatory.${hash(observatory)}.js`,
              discoveryStorage = require('esbuild').transformSync(
                read(path.join(SRC, 'discovery-storage.js')),
                { minify: true, target: 'es2022' },
              ).code,
              discoveryStorageURL = `./assets/discovery-storage.${hash(discoveryStorage)}.js`;
            write(path.join(DIST, observatoryURL), observatory);
            write(path.join(DIST, discoveryStorageURL), discoveryStorage);
          """,
          )
          replace_once(
              """        clubEngineBundle +
                    observatory +
                    css +
          """,
              """        clubEngineBundle +
                    observatory +
                    discoveryStorage +
                    css +
          """,
          )
          replace_once(
              """globalThis.ALIBI_OBSERVATORY_URL=${JSON.stringify(observatoryURL)};\\n` +
          """,
              """globalThis.ALIBI_OBSERVATORY_URL=${JSON.stringify(observatoryURL)};\\nglobalThis.ALIBI_DISCOVERY_STORAGE_URL=${JSON.stringify(discoveryStorageURL)};\\n` +
          """,
          )
          replace_once(
              """    workerURL,
                contentURL,
          """,
              """    workerURL,
                discoveryStorageURL,
                contentURL,
          """,
          )
          replace_once(
              """    observatoryBytes: Buffer.byteLength(observatory),
                officialContentBytes:
          """,
              """    observatoryBytes: Buffer.byteLength(observatory),
                discoveryStorageBytes: Buffer.byteLength(discoveryStorage),
                discoveryStorageGzipBytes: zlib.gzipSync(discoveryStorage).length,
                officialContentBytes:
          """,
          )
          path.write_text(source, encoding='utf-8')
          PY
          npx prettier --write tools/build.cjs
          git rm .github/workflows/discovery-storage-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/build.cjs
          git commit -m "build(storage): emit discovery CAS as lazy asset"
          git push origin HEAD:feat/discovery-meta-cas-30
