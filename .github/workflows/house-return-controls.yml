name: House return ownership
on:
  pull_request:
    paths:
      - 'src/house/**'
      - 'src/house-loader.js'
      - 'src/app.js'
      - 'tools/build-house.cjs'
      - 'tests/house-return-ownership.test.cjs'
      - 'tests/browser_house_return_ownership.py'
      - '.github/workflows/house-return-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: house-return-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind the exact source and tested files
        run: |
          set -eu
          mkdir -p test-results/house-return
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD > test-results/house-return/source-head.txt
          git rev-parse 'HEAD^{tree}' > test-results/house-return/source-tree.txt
          sha256sum src/house/controller.js src/house/model.js tests/house-return-ownership.test.cjs tests/browser_house_return_ownership.py .github/workflows/house-return-controls.yml > test-results/house-return/tested-sources.sha256
          git archive HEAD src/house tests/house-return-ownership.test.cjs tests/browser_house_return_ownership.py .github/workflows/house-return-controls.yml > test-results/house-return/tested-source.tar
      - run: npm ci
      - run: npm run format:check
      - name: Verify controller and existing focus contracts
        run: |
          set -o pipefail
          node --test tests/house-return-ownership.test.cjs tests/house.test.cjs tests/house-focus-waits.test.cjs 2>&1 | tee test-results/house-return/node-tests.log
      - run: npm run build:web
      - run: node --test tests/budget.test.cjs tests/house.delivery.test.cjs
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify source-mode controls separately
        run: |
          node tools/preview-house.cjs house-preview.html
          ALIBI_HOUSE_SOURCE="$PWD/house-preview.html" ALIBI_RESULTS=test-results/house-return/source python tests/browser_house_return_ownership.py
      - name: Verify actual-origin controls and unchanged puzzle state
        run: |
          set -eu
          cp build-info.json test-results/house-return/build-info.json
          node tools/serve.cjs > test-results/house-return/server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/ >/dev/null
          ALIBI_RESULTS=test-results/house-return/origin python tests/browser_house_return_ownership.py
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: house-return-controls
          path: test-results/house-return/
          if-no-files-found: error
          retention-days: 14
