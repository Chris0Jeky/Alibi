name: Temporary bounded journey implementation

on:
  push:
    branches:
      - feat/observatory-puzzle-journey-18

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install media validation dependency
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
      - name: Apply journey hooks and verify the repository
        run: python scripts/tmp_patch_observatory_journey.py
