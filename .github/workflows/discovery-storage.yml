name: Verify discovery metadata storage
on:
  push:
    paths:
      - 'src/discovery-entitlements.js'
      - 'src/discovery-storage.js'
      - 'src/storage.js'
      - 'tools/build.cjs'
      - 'tests/browser_discovery_storage.py'
      - 'tests/discovery-entitlements.test.cjs'
      - 'tests/storage.test.cjs'
      - 'tests/budget.test.cjs'
      - 'tests/sw.test.cjs'
      - '.github/workflows/discovery-storage.yml'
  pull_request:
    paths:
      - 'src/discovery-entitlements.js'
      - 'src/discovery-storage.js'
      - 'src/storage.js'
      - 'tools/build.cjs'
      - 'tests/browser_discovery_storage.py'
      - 'tests/discovery-entitlements.test.cjs'
      - 'tests/storage.test.cjs'
      - 'tests/budget.test.cjs'
      - 'tests/sw.test.cjs'
      - '.github/workflows/discovery-storage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discovery-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: node --check src/discovery-storage.js
      - run: npm run build
      - name: Verify storage, release and budget contracts
        run: |
          node --test \
            tests/discovery-entitlements.test.cjs \
            tests/storage.test.cjs \
            tests/budget.test.cjs \
            tests/sw.test.cjs
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install chromium
      - name: Race two real IndexedDB tabs
        run: |
          npm start > /tmp/alibi-discovery-storage-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/ > /dev/null && break
            sleep 1
          done
          python tests/browser_discovery_storage.py
      - name: Check formatting independently of runtime acceptance
        if: always()
        run: npm run format:check
      - name: Print acceptance evidence
        if: always()
        run: |
          cat test-results/discovery-storage/receipt.json 2>/dev/null || true
          cat /tmp/alibi-discovery-storage-server.log 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: discovery-storage-evidence-${{ github.run_id }}
          path: |
            test-results/discovery-storage/
            build-info.json
          if-no-files-found: ignore
