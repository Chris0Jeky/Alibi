name: Archive format probe
on:
  push:
    paths:
      - 'tests/archive-difficulty.test.cjs'
      - '.github/workflows/archive-format-probe.yml'
permissions:
  contents: read
jobs:
  prettier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Print exact pinned-Prettier result
        run: |
          npx prettier tests/archive-difficulty.test.cjs --write
          printf '%s\n' '---BEGIN FORMATTED FILE---'
          cat tests/archive-difficulty.test.cjs
          printf '%s\n' '---END FORMATTED FILE---'
