name: Verify Android native host

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      ALIBI_EVENT_NAME: ${{ github.event_name }}
      ALIBI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      ALIBI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Verify native scope classifier
        id: scope_tests
        run: node --test tests/android-native-scope.test.cjs
      - name: Classify native scope from trusted base
        id: scope
        run: |
          mode=full
          if [[ "$ALIBI_EVENT_NAME" == pull_request && "$ALIBI_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             git show "$ALIBI_BASE_SHA:tools/android-native-scope.cjs" > "$RUNNER_TEMP/alibi-native-scope.cjs"; then
            if GITHUB_OUTPUT= node "$RUNNER_TEMP/alibi-native-scope.cjs" > "$RUNNER_TEMP/alibi-native-scope.json"; then
              candidate=$(node -e 'try { const v = require(process.argv[1]); if (v.mode === "docs-only") process.stdout.write(v.mode); } catch {}' "$RUNNER_TEMP/alibi-native-scope.json")
              if [[ "$candidate" == docs-only ]]; then mode=docs-only; fi
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Native verification mode: $mode"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: steps.scope.outputs.mode == 'full'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.scope.outputs.mode == 'full'
        with:
          python-version: '3.12'
      - name: Verify wrapper and record exact source
        if: steps.scope.outputs.mode == 'full'
        run: |
          echo '7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          mkdir -p test-results/native
          git rev-parse HEAD > test-results/native/source-sha.txt
          node --version > test-results/native/node.txt
          java -version 2> test-results/native/java.txt
      - run: npm ci
        if: steps.scope.outputs.mode == 'full'
      - name: Capture formatting diagnostics without editing source
        if: steps.scope.outputs.mode == 'full'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import * as prettier from 'prettier';
          const files = ['tools/android-host-policy.cjs', 'tools/sync-android.cjs',
            'tests/android-host-policy.test.cjs', 'tests/android-native-workflow.test.cjs',
            'tests/android-build.test.cjs', 'tools/android-generated-inputs.cjs',
            'tests/android-generated-inputs.test.cjs', 'android/gradle/generated-inputs.json'];
          for (const file of files) {
            const source = await fs.readFile(file, 'utf8');
            const options = await prettier.resolveConfig(file);
            const formatted = await prettier.format(source, { ...options, filepath: file });
            const destination = path.join('test-results/native-format', file);
            await fs.mkdir(path.dirname(destination), { recursive: true });
            await fs.writeFile(destination, formatted);
          }
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.scope.outputs.mode == 'full'
        with:
          name: native-format-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/native-format
          retention-days: 3
      - name: Exercise fail-closed source and package contracts
        if: steps.scope.outputs.mode == 'full'
        run: |
          node --test tests/android-host-policy.test.cjs tests/android-generated-inputs.test.cjs tests/android-native-workflow.test.cjs tests/platform-native.test.mjs tests/platform-bootstrap.test.mjs
          python tests/test_android_package.py
          python tests/test_android_permission_values.py
          python tests/test_android_smoke_evidence.py
          python tests/test_android_apk_identity.py
          python tests/test_android_smoke_runner.py
          bash -n tools/run-android-smoke.sh
      - name: Prepare Android tools
        if: steps.scope.outputs.mode == 'full'
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          sdkmanager --list_installed > test-results/native/sdk-packages.txt
      - name: Build and verify the actual native payload
        if: steps.scope.outputs.mode == 'full'
        run: npm run native:sync
      - name: Compile, lint and assemble without rewriting dependency evidence
        if: steps.scope.outputs.mode == 'full'
        working-directory: android
        run: ./gradlew --no-daemon --dependency-verification=strict -Dorg.gradle.dependency.verification.console=verbose lintDebug testDebugUnitTest assembleDebug assembleCapacitorPreview
      - name: Inspect actual APKs, alignment and debug signatures
        if: steps.scope.outputs.mode == 'full'
        run: |
          apkanalyzer manifest print android/app/build/outputs/apk/debug/app-debug.apk > test-results/native/debug-manifest.xml
          apkanalyzer manifest print android/app/build/outputs/apk/capacitorPreview/app-capacitorPreview.apk > test-results/native/preview-manifest.xml
          python tools/check-android-package.py --apk android/app/build/outputs/apk/debug/app-debug.apk --variant debug --receipt test-results/native/debug-package.json
          python tools/check-android-package.py --apk android/app/build/outputs/apk/capacitorPreview/app-capacitorPreview.apk --variant capacitorPreview --receipt test-results/native/preview-package.json
          for apk in android/app/build/outputs/apk/debug/*.apk android/app/build/outputs/apk/capacitorPreview/*.apk; do
            zipalign -c -P 16 -v 4 "$apk"
            apksigner verify --verbose --print-certs "$apk"
          done > test-results/native/signatures-alignment.txt
      - name: Prepare emulator after package validation
        if: steps.scope.outputs.mode == 'full'
        run: |
          # The headless emulator still links libpulse.so.0 on Ubuntu 24.04.
          # Use the same Ubuntu-only package sources as the full verification lane.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install --yes --no-install-recommends libpulse0
          sdkmanager --version > test-results/native/sdkmanager-version.txt 2>&1 || true

          record_sdk_state() {
            local label="$1"
            {
              printf 'Disk availability\n'
              df -hP "$ANDROID_HOME" "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
              printf '\nInstalled SDK package identities\n'
              sdkmanager --list_installed
            } > "test-results/native/sdk-state-${label}.txt" 2>&1 || true
          }

          install_sdk_package() {
            local label="$1"
            shift
            local -a pipeline_status
            set +e
            sdkmanager "$@" 2>&1 | tee "test-results/native/sdkmanager-${label}.log"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            printf 'sdkmanager_exit=%s\ntee_exit=%s\n' \
              "${pipeline_status[0]}" "${pipeline_status[1]}" \
              > "test-results/native/sdkmanager-${label}.status" 2>/dev/null || true
            return "${pipeline_status[0]}"
          }

          record_sdk_state before-emulator
          # Record and use the hosted image's emulator when available. Updating it is
          # not a prerequisite for compiling or auditing an APK.
          if test ! -x "$ANDROID_HOME/emulator/emulator"; then
            if install_sdk_package emulator 'emulator'; then
              record_sdk_state after-emulator
            else
              install_status=$?
              record_sdk_state after-emulator-failure
              exit "$install_status"
            fi
          fi
          "$ANDROID_HOME/emulator/emulator" -version > test-results/native/emulator-version.txt
          if install_sdk_package system-image 'system-images;android-36;google_apis;x86_64'; then
            record_sdk_state after-system-image
          else
            install_status=$?
            record_sdk_state after-system-image-failure
            exit "$install_status"
          fi
          sdkmanager --list_installed > test-results/native/sdk-packages.txt
      - name: Boot the installed debug host offline and exercise native WebView navigation
        if: steps.scope.outputs.mode == 'full'
        run: bash tools/run-android-smoke.sh
      - name: Confirm source and dependency locks stayed unchanged
        if: steps.scope.outputs.mode == 'full'
        id: native_complete
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Preserve native receipts and failure diagnostics
        if: always() && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/native
            dist-android/android-assets.json
            dist-android/android-build-identity.json
            android/app/build/outputs/apk/capacitorPreview/*.apk
            android/app/build/outputs/androidTest-results/connected
            android/app/build/reports
            android/build/reports/dependency-verification
            android/capacitor.settings.gradle
            android/app/capacitor.build.gradle
            android/capacitor-cordova-android-plugins/build.gradle
            android/capacitor-cordova-android-plugins/cordova.variables.gradle
          if-no-files-found: warn
          retention-days: 7
      - name: Require selected native result
        if: always()
        env:
          SCOPE: ${{ steps.scope.outputs.mode }}
          SCOPE_RESULT: ${{ steps.scope.outcome }}
          TEST_RESULT: ${{ steps.scope_tests.outcome }}
          FULL_RESULT: ${{ steps.native_complete.outcome }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$TEST_RESULT" = success
          if test "$SCOPE" = full; then
            test "$FULL_RESULT" = success
          else
            test "$SCOPE" = docs-only && test "$FULL_RESULT" = skipped
          fi
