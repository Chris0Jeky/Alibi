name: Format route recovery

on:
  push:
    branches:
      - fix/hash-route-not-found-224

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/boot.js tests/hash-route-not-found.test.cjs
      - name: Emit formatted sources
        shell: bash
        run: |
          echo '---BOOT-BASE64---'
          base64 -w0 src/boot.js
          echo
          echo '---TEST-BASE64---'
          base64 -w0 tests/hash-route-not-found.test.cjs
          echo
