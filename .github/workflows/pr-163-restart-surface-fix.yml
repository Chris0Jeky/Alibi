name: Apply Block Cabinet restart review fix

on:
  push:
    branches:
      - codex/block-cabinet-restart
    paths:
      - .github/workflows/pr-163-restart-surface-fix.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/block-cabinet-restart
          fetch-depth: 0
      - name: Put restart in the owned surface
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/block-cabinet/surface.mjs')
          text = path.read_text()
          old_controls = '''    <div class="bc-controls"><button type="button" data-command="undo">↶ <span>Undo</span></button><button type="button" data-command="redo">↷ <span>Redo</span></button><button type="button" data-command="rotate" hidden>⟳ <span>Rotate</span></button><button type="button" data-command="sound" aria-pressed="false">Sound off</button><button type="button" data-command="haptics" aria-pressed="false">Haptics off</button></div>'''
          new_controls = '''    <div class="bc-controls"><button type="button" data-command="undo">↶ <span>Undo</span></button><button type="button" data-command="redo">↷ <span>Redo</span></button><button type="button" data-command="rotate" hidden>⟳ <span>Rotate</span></button><button type="button" data-command="new" data-bc-restart>↻ <span>Start again</span></button><button type="button" data-command="sound" aria-pressed="false">Sound off</button><button type="button" data-command="haptics" aria-pressed="false">Haptics off</button></div>'''
          old_tools = '''    <div class="bc-tools"><button type="button" data-command="new">New seeded game</button><button type="button" data-command="export">Export replay</button><button type="button" data-command="import">Import replay</button><button type="button" data-command="simple" hidden>Simple controls</button></div>'''
          new_tools = '''    <div class="bc-tools"><button type="button" data-command="export">Export replay</button><button type="button" data-command="import">Import replay</button><button type="button" data-command="simple" hidden>Simple controls</button></div>'''
          if text.count(old_controls) != 1:
              raise SystemExit(f'expected one controls target, found {text.count(old_controls)}')
          if text.count(old_tools) != 1:
              raise SystemExit(f'expected one tools target, found {text.count(old_tools)}')
          path.write_text(text.replace(old_controls, new_controls).replace(old_tools, new_tools))
          PY
          rm .github/workflows/pr-163-restart-surface-fix.yml
      - name: Commit reviewed implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/block-cabinet/surface.mjs .github/workflows/pr-163-restart-surface-fix.yml
          git commit -m "fix(block-cabinet): own restart control in tactile surface"
          git push origin HEAD:codex/block-cabinet-restart
