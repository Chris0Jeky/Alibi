name: Apply compact Nonogram CSS review fix

on:
  push:
    branches:
      - codex/nonogram-compact-grid
    paths:
      - .github/workflows/pr-162-nonogram-css-fix.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/nonogram-compact-grid
          fetch-depth: 0
      - name: Move component rules into app.css
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          index = Path('src/index.html')
          html = index.read_text()
          marker = 'Compact 15×15 Nonograms need content-neutral row geometry.'
          marker_at = html.find(marker)
          if marker_at < 0:
              raise SystemExit('compact Nonogram style marker is missing')
          start = html.rfind('    <style>', 0, marker_at)
          end = html.find('    </style>', marker_at)
          if start < 0 or end < 0:
              raise SystemExit('compact Nonogram style wrapper is missing')
          end += len('    </style>\n')
          inline = html[start:end]
          body = inline.split('<style>', 1)[1].rsplit('</style>', 1)[0]
          rules = dedent(body).strip() + '\n'
          index.write_text(html[:start] + html[end:])

          css_path = Path('src/app.css')
          css = css_path.read_text()
          anchor = '.nono-cell .cross {\n  font-size: 21px;\n}\n'
          if css.count(anchor) != 1:
              raise SystemExit(f'expected one canonical cross rule, found {css.count(anchor)}')
          css_path.write_text(css.replace(anchor, anchor + rules))
          PY
          rm .github/workflows/pr-162-nonogram-css-fix.yml
      - name: Commit reviewed placement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html src/app.css .github/workflows/pr-162-nonogram-css-fix.yml
          git commit -m "refactor(nonogram): keep compact-grid rules in app stylesheet"
          git push origin HEAD:codex/nonogram-compact-grid
