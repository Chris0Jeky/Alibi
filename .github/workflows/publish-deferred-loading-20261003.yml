name: Publish bounded deferred loading fix
on:
  push:
    branches: [codex/deferred-puzzle-loading-20261003]
    paths: [.github/workflows/publish-deferred-loading-20261003.yml]
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.repository == 'Chris0Jeky/Alibi' &&
      github.actor == 'Chris0Jeky' &&
      github.event.before == 'a2b246ed4701d2865f5bc7c0b6ab9582291392fb'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TARGET_BRANCH: codex/deferred-puzzle-loading-20261003
      PARENT_SOURCE: a2b246ed4701d2865f5bc7c0b6ab9582291392fb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply only the exact tested source delta
        run: |
          set -eu
          echo 'b6df354ee5f68e1a7cfaf92450fa9557e30c31e5bf2ba4d5dce59d7aa327b092  src/app.js' | sha256sum -c -
          echo '729e20ba2231bd9cde556f558d53cb9c04dcf4f5e3727ba3da4b87cb834f03f3  tools/build-official-content.cjs' | sha256sum -c -
          echo '9b8b7ccffa067059def0e6ebb4826b41e0059b7411413aafcd022bfc0919a353  tests/official-deferred.test.cjs' | sha256sum -c -
          git apply deferred-loading-source.patch
          echo '61d8494aa47e8270347617e32055ab9ffd1bed3ed7f3f45432b6cc4b197ff7b7  src/app.js' | sha256sum -c -
          echo '307b2c7e20ebafe7d728092dec37d6ade5c42e1b567469ec883a06e8d3ee8a06  tools/build-official-content.cjs' | sha256sum -c -
          echo 'e43908516e3dce503c9ebf0dd44a8e329298bf7ebd90a6129e7092ae60f0ddfe  tests/official-deferred.test.cjs' | sha256sum -c -
      - run: npm ci
      - name: Format tests, regenerate truthful app receipts and verify scope
        run: |
          npx --no-install prettier --write tests/deferred-loading.test.cjs tests/deferred-route.test.cjs
          node tools/assets/catalogue.cjs
          python -m py_compile tests/browser_deferred_loading.py
          node --test tests/deferred-*.test.cjs tests/asset-catalogue.test.cjs tests/block-replay-cache.test.cjs tests/club-run-defaults.test.cjs
      - name: Preserve handoff and commit only the bounded slice
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args])
          p=Path('assets-source/library/catalogue.json')
          old=json.loads(git('show','HEAD:'+str(p)))
          new=json.loads(p.read_text())
          count=[0]
          def replace(value):
              if isinstance(value,dict):
                  if value.get('path')=='src/app.js' and 'sha256' in value:
                      count[0]+=1
                      value['bytes']=Path('src/app.js').stat().st_size
                      value['sha256']=hashlib.sha256(Path('src/app.js').read_bytes()).hexdigest()
                  for v in value.values():replace(v)
              elif isinstance(value,list):
                  for v in value:replace(v)
          replace(old)
          assert count[0]==13,count
          assert old==new,'catalogue changed outside the thirteen app source receipts'
          p=Path('docs/STATE.md')
          p.write_text(p.read_text()+'\n## 2026-10-03: bounded deferred puzzle loading (#389 item 2)\n\nA pending play route clears the previous board after saving/leaving and shows\nOpening puzzle with a Back to puzzles link. Shared definition attempts expire\nafter ten seconds and release their handlers/timers for retry. Saved pinned\ndefinitions resume without waiting for a catalogue request. Route serials reject\nlate navigation results; the worker/content atomic validator remains unchanged.\nThirteen new loader/route cases and the existing emitted-content tests cover\nstall, retry, synchronous setup, invalid delivery and saved revisions. Initial\nregressions reproduced six failures across ten cases. Actual-browser loading,\nretry and real IndexedDB resume are gated separately at phone/desktop widths.\nThe current source fits unchanged budgets; thirteen app catalogue receipts were\nregenerated. Item 1 practice counts and item 3 identity/#459 remain open. This is\nstacked on #566; current-head full CI, browser evidence and independent review\nprecede merge. No save schema, puzzle revision or deployment changes.\n')
          git('add','src/app.js','tools/build-official-content.cjs','tests/official-deferred.test.cjs','tests/deferred-loading.test.cjs','tests/deferred-route.test.cjs','assets-source/library/catalogue.json','docs/STATE.md')
          git('rm','deferred-loading-source.patch','.github/workflows/publish-deferred-loading-20261003.yml')
          allowed={'src/app.js','tools/build-official-content.cjs','tests/official-deferred.test.cjs','tests/deferred-loading.test.cjs','tests/deferred-route.test.cjs','assets-source/library/catalogue.json','docs/STATE.md','deferred-loading-source.patch','.github/workflows/publish-deferred-loading-20261003.yml'}
          actual=set(git('diff','--cached','--name-only').decode().splitlines())
          assert actual<=allowed,actual
          git('diff','--cached','--check')
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(play): bound deferred loading and preserve route-owned pending and retry state'],check=True)
      - name: Verify clean source and retain exact publication evidence
        run: |
          set -o pipefail
          mkdir -p test-results/deferred-publication
          git rev-parse HEAD > test-results/deferred-publication/source-head.txt
          git rev-parse HEAD^{tree} > test-results/deferred-publication/tree.txt
          git diff --binary "$PARENT_SOURCE" HEAD > test-results/deferred-publication/source.patch
          npm run verify 2>&1 | tee test-results/deferred-publication/verify.log
          cp build-info.json test-results/deferred-publication/build-info.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deferred-publication-evidence
          path: test-results/deferred-publication/
          retention-days: 14
      - name: Publish only the unchanged isolated branch
        run: |
          set -eu
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
