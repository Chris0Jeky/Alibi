# Temporary branch-only workflow: share the canonical runtime tier registry with the
# house, remove one unreferenced core helper, verify strict budgets and contracts,
# then remove itself and the superseded diagnostic helper.
name: Apply difficulty budget correction

on:
  push:
    branches:
      - feat/difficulty-tiers-161
    paths:
      - '.github/workflows/apply-difficulty-budget-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/difficulty-tiers-161
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply, format and verify the bounded correction
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(filename, before, after) {
            const source = fs.readFileSync(filename, 'utf8');
            const parts = source.split(before);
            if (parts.length !== 2) {
              throw new Error(`${filename}: expected one correction anchor; found ${parts.length - 1}.`);
            }
            fs.writeFileSync(filename, parts.join(after));
          }

          replaceOnce('src/core.js', '  const colOf = (cell, n) => cell % n;\n', '');
          replaceOnce(
            'src/house/model.js',
            "  const levels = ['Gentle', 'Steady', 'Tricky', 'Expert', 'Master', 'Grandmaster'];\n",
            '  const levels = G.AlibiCore.DIFFICULTIES;\n',
          );
          replaceOnce(
            'tests/house.test.cjs',
            "const zlib = require('node:zlib');\nconst M = require('../src/house/model.js');\n",
            "const zlib = require('node:zlib');\nrequire('../src/core.js');\nconst M = require('../src/house/model.js');\n",
          );
          replaceOnce(
            'tests/difficulty-tiers.test.cjs',
            '  assert.deepEqual(Model.levels, TIERS);\n',
            '  assert.equal(Model.levels, Core.DIFFICULTIES);\n',
          );
          NODE
          npx prettier --write src/core.js src/house/model.js tests/house.test.cjs tests/difficulty-tiers.test.cjs
          npm run build
          node --test tests/difficulty-tiers.test.cjs tests/house.test.cjs tests/budget.test.cjs
      - name: Remove temporary migration files
        run: rm tools/apply-difficulty-budget-fix.cjs .github/workflows/apply-difficulty-budget-fix.yml
      - name: Commit verified source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core.js src/house/model.js tests/house.test.cjs tests/difficulty-tiers.test.cjs
          git add -u tools/apply-difficulty-budget-fix.cjs .github/workflows/apply-difficulty-budget-fix.yml
          git commit -m "fix(difficulty): share tiers and preserve bundle budget"
          git push origin HEAD:feat/difficulty-tiers-161
