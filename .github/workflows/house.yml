name: Verify mobile desk
on:
  pull_request:
    paths:
      - 'src/house/**'
      - 'src/house-loader.js'
      - 'tools/build*.cjs'
      - 'tools/preview-house.cjs'
      - 'tests/*house*'
      - '.github/workflows/house.yml'
  push:
    branches: ['codex/wrenmere-mobile-components']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: house-${{ github.ref }}
  cancel-in-progress: true
jobs:
  house:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: node --test tests/house.test.cjs
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install chromium
      - name: Explicit source-preview acceptance
        run: |
          node tools/preview-house.cjs house-preview.html
          ALIBI_HOUSE_SOURCE="$PWD/house-preview.html" ALIBI_RESULTS=test-results/house-source python tests/browser_house.py
          ALIBI_HOUSE_SOURCE="$PWD/house-preview.html" ALIBI_RESULTS=test-results/house-mobile-source python tests/browser_house_mobile.py
      - name: Production-origin component acceptance
        run: |
          npm start > /tmp/alibi-house.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8787/ > /dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8787/ > /dev/null
          ALIBI_RESULTS=test-results/house-origin python tests/browser_house.py
          ALIBI_RESULTS=test-results/house-mobile-origin python tests/browser_house_mobile.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: house-evidence-${{ github.run_id }}
          path: |
            test-results/house*/
            build-info.json
            house-preview.html
          if-no-files-found: warn
          retention-days: 14
