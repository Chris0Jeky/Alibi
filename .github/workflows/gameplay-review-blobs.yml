name: Fixed gameplay review blobs
on:
  push:
    branches: [codex/347-games-finish]
    paths: [.github/workflows/gameplay-review-blobs.yml]
permissions:
  contents: write
jobs:
  blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 13c2ee6701a293839aca1f22d8d328c34b784f58
          persist-credentials: false
      - name: Verify two fixed before/after identities before immutable upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,pathlib,urllib.request
          changes=[
            ('src/club.js','0e680093be163dcb33cd6961ad1d408c1e382d90','802f57f636111e23492275090c975b9422a90bc9',[
              ('if (!e.data || !Number.isInteger(e.data.id)) botFailure();','botFailure();')]),
            ('tests/duel-recovery.test.cjs','9adc9c03100864ebf009830c9339ef78b7442b07','4765dca3f12f00cc5b1b619b0f9472abfa3393df',[
              ("['error', 'message-error', 'malformed', 'illegal']","['error', 'message-error', 'malformed', 'illegal', 'mismatched-id']"),
              ('id: worker.request.id,',"id: worker.request.id + (kind === 'mismatched-id' ? 1 : 0),")])
          ]
          def blob(data):return hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
          outputs=[]
          for path,before,after,edits in changes:
              data=pathlib.Path(path).read_bytes()
              assert blob(data)==before,path
              value=data.decode()
              for old,new in edits:
                  assert old in value,path
                  value=value.replace(old,new,1)
              data=value.encode()
              assert blob(data)==after,path
              outputs.append((path,after,data))
          for path,after,data in outputs:
              req=urllib.request.Request('https://api.github.com/repos/Chris0Jeky/Alibi/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req) as response: result=json.load(response)
              assert result['sha']==after,path
              print(path,after)
