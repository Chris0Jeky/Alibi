name: Reconcile Castle map zoom with main
on:
  push:
    branches:
      - feat/castle-map-zoom-45
permissions:
  contents: write
concurrency:
  group: rebase-castle-map-zoom-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/castle-map-zoom-45
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Merge current main and preserve both Castle slices
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit -X ours origin/main
          merge_status=$?
          set -e
          unmerged="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unmerged" ]; then
            allowed='docs/STATE.md src/castle/native-style.mjs src/castle/pages.mjs src/castle/view.mjs tests/browser_castle_exploration.py'
            while IFS= read -r path; do
              case " $allowed " in
                *" $path "*) git checkout --ours -- "$path"; git add "$path" ;;
                *) echo "Unexpected merge conflict: $path" >&2; exit 1 ;;
              esac
            done <<< "$unmerged"
          elif [ "$merge_status" -ne 0 ]; then
            echo 'Merge failed without a resolvable content conflict.' >&2
            exit "$merge_status"
          fi
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def show(path):
              return subprocess.check_output(['git', 'show', f'origin/main:{path}'], text=True)

          def replace_block(current, source, start, end):
              left = current.index(start)
              right = current.index(end, left)
              source_left = source.index(start)
              source_right = source.index(end, source_left)
              return current[:left] + source[source_left:source_right] + current[right:]

          path = Path('src/castle/pages.mjs')
          current = path.read_text(encoding='utf-8')
          main = show(str(path))
          if 'inspectablesVisible = true' not in current:
              marker = '  practiceSnapshot,\n}) {'
              if marker not in current:
                  raise SystemExit('Castle pages signature changed while reconciling zoom.')
              current = current.replace(
                  marker,
                  '  practiceSnapshot,\n  inspectablesVisible = true,\n}) {',
                  1,
              )
          current = replace_block(
              current,
              main,
              '  function roomPage() {',
              '  function museumPage() {',
          )
          path.write_text(current, encoding='utf-8')

          path = Path('src/castle/view.mjs')
          current = path.read_text(encoding='utf-8')
          main = show(str(path))
          if 'inspectablesVisible = true' not in current:
              marker = "    filter = 'all';"
              if marker not in current:
                  raise SystemExit('Castle view state declaration changed while reconciling zoom.')
              current = current.replace(
                  marker,
                  "    filter = 'all',\n    inspectablesVisible = true;",
                  1,
              )
          compact = 'createPages({ state, view, selected, era, mapZoom, search, filter, practiceSnapshot });'
          if compact in current:
              current = current.replace(
                  compact,
                  "createPages({\n      state,\n      view,\n      selected,\n      era,\n      mapZoom,\n      search,\n      filter,\n      practiceSnapshot,\n      inspectablesVisible,\n    });",
                  1,
              )
          elif 'inspectablesVisible,' not in current[current.index('  const pages = () =>'):current.index('  const roomCard', current.index('  const pages = () =>'))]:
              raise SystemExit('Castle pages projection changed while reconciling zoom.')
          current = replace_block(
              current,
              main,
              '  function inspect(id) {',
              '  function editTheory(id) {',
          )
          if "el.id === 'show-inspectables'" not in current:
              marker = "      } else if (el.id === 'filter') {"
              if marker not in current:
                  raise SystemExit('Castle change handler changed while reconciling zoom.')
              current = current.replace(
                  marker,
                  "      } else if (el.id === 'show-inspectables') {\n        inspectablesVisible = el.checked;\n      } else if (el.id === 'filter') {",
                  1,
              )
          path.write_text(current, encoding='utf-8')

          path = Path('src/castle/native-style.mjs')
          current = path.read_text(encoding='utf-8')
          main = show(str(path))
          if '.inspectable-toggle{' not in current:
              source_start = main.index('.inspectable-toggle{')
              source_end = main.index('.method{', source_start)
              marker = '.method{'
              if marker not in current:
                  raise SystemExit('Castle native style changed while reconciling zoom.')
              current = current.replace(marker, main[source_start:source_end] + marker, 1)
          path.write_text(current, encoding='utf-8')

          path = Path('docs/STATE.md')
          current = path.read_text(encoding='utf-8')
          main = show(str(path))
          heading = '## Castle inspectable-object round-2 review fix'
          if heading not in current:
              source_start = main.index(heading)
              source_end = main.index('## Published', source_start)
              target = current.index('## Published')
              current = current[:target] + main[source_start:source_end] + current[target:]
          path.write_text(current, encoding='utf-8')

          path = Path('tests/browser_castle_exploration.py')
          current = path.read_text(encoding='utf-8')
          main = show(str(path))
          marker = "                markers=page.locator('.hotspot.observation')"
          if marker not in current:
              source_start = main.index(marker)
              source_end_marker = "                page.locator('.hotspot.observation').click()"
              source_end = main.index(source_end_marker, source_start)
              target = current.index(source_end_marker)
              current = current[:target] + main[source_start:source_end] + current[target:]
          path.write_text(current, encoding='utf-8')
          PY
          npx prettier --write src/castle/native-style.mjs src/castle/pages.mjs src/castle/view.mjs
          git rm .github/workflows/rebase-castle-map-zoom.yml
          git add docs/STATE.md src/castle/native-style.mjs src/castle/pages.mjs src/castle/view.mjs tests/browser_castle_exploration.py
          git diff --cached --check
          node --test tests/castle*.test.mjs
          npm run build
          git commit -m "merge(main): reconcile Castle map zoom"
          git push origin HEAD:feat/castle-map-zoom-45
