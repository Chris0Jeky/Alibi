name: Verify Wrenmere integration
on:
  push:
    paths:
      - 'src/castle/**'
      - 'assets-source/castle/**'
      - 'src/app.js'
      - 'src/validator-worker.js'
      - 'src/activities.js'
      - 'src/castle-practice.js'
      - 'src/atmosphere.js'
      - 'tools/build*.cjs'
      - 'tests/*castle*'
      - '.github/workflows/castle.yml'
  pull_request:
    paths:
      - 'src/castle/**'
      - 'assets-source/castle/**'
      - 'src/app.js'
      - 'src/validator-worker.js'
      - 'src/activities.js'
      - 'src/castle-practice.js'
      - 'src/atmosphere.js'
      - 'tools/build*.cjs'
      - 'tests/*castle*'
      - '.github/workflows/castle.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: castle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compact-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/castle-evidence-compare-51'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/castle-evidence-compare-51
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compact and publish the evidence controller
        run: |
          python tools/compact-castle-evidence.py
          npx prettier --write src/castle/evidence-view.mjs src/castle/view.mjs tests/castle-evidence-view.test.mjs
          git fetch origin main
          git show origin/main:.github/workflows/castle.yml > .github/workflows/castle.yml
          git show origin/main:tools/build-castle.cjs > tools/build-castle.cjs
          git rm tools/compact-castle-evidence.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/castle.yml tools/build-castle.cjs src/castle/evidence-view.mjs src/castle/view.mjs tests/castle-evidence-view.test.mjs
          git commit -m "perf(castle): keep evidence comparison within budget"
          git push origin HEAD:feat/castle-evidence-compare-51
  castle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - name: Show exact formatting differences
        run: |
          for file in src/activities.js tests/castle*.test.mjs; do
            npx prettier "$file" | diff -u "$file" - || true
          done
      - run: node --test tests/castle*.test.mjs
      - run: npm run build
      - run: node tests/budget.test.cjs
      - run: python -m pip install -r requirements-dev.txt
      # Use the browser revision pinned by requirements-dev.txt and the runner's system libraries.
      # A missing library still fails the actual launch; no browser acceptance is skipped.
      # This avoids apt update against the unrelated, currently inconsistent Chrome package index.
      - run: python -m playwright install chromium
      - name: Play the chapter and verify native storage
        run: |
          npm start > /tmp/alibi-castle-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8787/ > /dev/null && break; sleep 1; done
          python tests/browser_castle.py
          python tests/browser_castle_recovery.py
          python tests/browser_castle_investigation.py
          python tests/browser_castle_exploration.py
          python tests/browser_castle_update.py
          python tests/browser_castle_practice.py
      - name: Check formatting independently of runtime acceptance
        if: always()
        run: npm run format:check
      - name: Print acceptance evidence
        if: always()
        run: |
          cat test-results/castle/acceptance.json 2>/dev/null || true
          cat /tmp/alibi-castle-server.log 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: castle-evidence-${{ github.run_id }}
          path: |
            test-results/castle/
            test-results/castle-recovery/
            test-results/castle-investigation/
            test-results/castle-exploration/
            test-results/castle-update/
            test-results/castle-practice/
            build-info.json
          if-no-files-found: ignore
