name: Apply Block Cabinet review fixes

on:
  push:
    branches:
      - fix/block-cabinet-phone-actions-160
    paths:
      - '.github/workflows/apply-block-cabinet-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/block-cabinet-phone-actions-160
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply review fixes
        run: |
          node tools/apply-block-cabinet-review-fixes.cjs
          rm tools/apply-block-cabinet-review-fixes.cjs .github/workflows/apply-block-cabinet-review-fixes.yml
      - name: Commit implementation and state record
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/block-cabinet/style.css docs/STATE.md
          git add -u tools/apply-block-cabinet-review-fixes.cjs .github/workflows/apply-block-cabinet-review-fixes.yml
          git commit -m "fix(block-cabinet): keep phone actions sticky"
          git push origin HEAD:fix/block-cabinet-phone-actions-160
