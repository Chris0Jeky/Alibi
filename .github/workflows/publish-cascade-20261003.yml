name: Publish bounded Cascade layout repair
on:
  push:
    branches: [codex/cascade-narrow-controls-20261003]
    paths: [.github/workflows/publish-cascade-20261003.yml]
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.repository == 'Chris0Jeky/Alibi' &&
      github.actor == 'Chris0Jeky' &&
      github.event.before == 'beb6e1c1a94c91599c159f330d081724bb0d0a5a'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply the bounded layout and tray-overlap assertion
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          path=Path('src/block-cabinet/style.css');text=path.read_text()
          assert hashlib.sha256(text.encode()).hexdigest()=='3b44ab35809270978c56df3008d1f46c7dda6d3a67b840bbb03d2bff0fb8b727'
          text+='\n/* Five labelled Cascade actions need two rows on narrow phones. Keep this group\n   in normal dialog flow so the extra row cannot cover the selectable tray. */\n@media (max-width: 370px) {\n  body.block-motion-active .bc-modal .bc-controls {\n    position: static;\n    grid-auto-flow: row;\n    grid-template-columns: repeat(3, minmax(0, 1fr));\n  }\n}\n'
          assert hashlib.sha256(text.encode()).hexdigest()=='d16800935d96e6870b10f2edb44651c1710ed1d98e0125681772bec44d62fcd2'
          path.write_text(text)
          path=Path('tests/browser_cascade_controls.py');text=path.read_text()
          before='            assert len(measurements)==5, measurements'
          assert text.count(before)==1
          text=text.replace(before,before+"\n            if width==320:\n                tray=dialog.locator('.bc-tray').bounding_box()\n                actions=controls.bounding_box()\n                assert tray['y']+tray['height']<=actions['y']+1, (tray,actions)")
          path.write_text(text)
      - run: npm ci
      - name: Verify source and emitted budget
        run: |
          npx --no-install prettier --check src/block-cabinet/style.css
          node --test tests/block-cabinet-phone-actions.test.cjs tests/block-cabinet.test.cjs tests/block-motion.test.mjs tests/cascade-calibration.test.mjs tests/cascade-replay-store.test.mjs
          npm run build:web
          node --test tests/budget.test.cjs
          git diff --check
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_cascade_controls.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cascade-layout-publication-evidence
          path: test-results/cascade-controls/
          retention-days: 7
      - name: Record exact scope
        shell: python
        run: |
          from pathlib import Path
          path=Path('docs/STATE.md');text=path.read_text();heading='# Live development state\n'
          assert text.startswith(heading)
          note='\n## 2026-10-03: narrow Cascade actions (#562, follows #556)\n\nRefs #418 item 3. The 320px built-origin probe reproduced Rotate and Cancel text\nextending beyond their buttons. Below 371px, only the Cascade dialog now uses\nthree columns and normal-flow actions, preserving 44px targets, readable labels\nand the selectable tray. Classic and wider layouts retain their current rules.\nThe publication gate exercises all five controls, Rotate, keyboard Cancel, lab\nclose/focus and tray separation at 320x640, 390x844 and 1280x900. Full final-head\nCI and independent review remain gates; physical Android/TalkBack is unverified.\n'
          path.write_text(heading+note+text[len(heading):])
      - name: Commit, verify clean source and publish only this branch
        env:
          TARGET_BRANCH: codex/cascade-narrow-controls-20261003
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git diff --name-only > /tmp/cascade-changed
          python - <<'PY'
          from pathlib import Path
          paths=set(Path('/tmp/cascade-changed').read_text().splitlines())
          assert paths == {'src/block-cabinet/style.css','tests/browser_cascade_controls.py','docs/STATE.md'},paths
          PY
          git rm .github/workflows/publish-cascade-20261003.yml
          git add src/block-cabinet/style.css tests/browser_cascade_controls.py docs/STATE.md
          git -c user.name='Cristian Tcaci' -c user.email='59696583+Chris0Jeky@users.noreply.github.com' commit -m 'fix(cascade): keep narrow actions readable and clear of the tray'
          npm run verify
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
