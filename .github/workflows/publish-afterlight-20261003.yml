name: Compile and publish bounded Afterlight source
on:
  push:
    branches: [codex/afterlight-workshop-20261003]
    paths: [.github/workflows/publish-afterlight-20261003.yml]
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.repository == 'Chris0Jeky/Alibi' &&
      github.actor == 'Chris0Jeky' &&
      github.event.before == '5940a938b6bafae5996e12c5effd2f15df95136d'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TARGET_BRANCH: codex/afterlight-workshop-20261003
      BASE_SOURCE: fc51d98808774b67e48129cdc7a2aa79409b4fd7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Materialize the exact locally validated data and control fixtures
        shell: python
        run: |
          import json
          from pathlib import Path
          path=Path('content/curation/editorial/afterlight-blueprints.json')
          path.write_text(json.dumps(json.loads(path.read_text()),ensure_ascii=False,indent=2)+'\n')
          text=Path('tests/browser_lattice_studies.py').read_text()
          for a,b in [('Lattice','Afterlight'),('lattice','afterlight'),('afterlight-studies.json','afterlight-pictures.json'),('24','10')]:
              text=text.replace(a,b)
          Path('tests/browser_afterlight_studies.py').write_text(text)
          text=Path('tests/lattice-readiness.test.cjs').read_text().replace('Lattice','Afterlight').replace('lattice','afterlight').replace('afterlight-lightup-01','afterlight-picture-01')
          Path('tests/afterlight-readiness.test.cjs').write_text(text)
          text=Path('.github/workflows/lattice-controls.yml').read_text().replace('Lattice','Afterlight').replace('lattice','afterlight').replace('editorial/afterlight-studies.json','editorial/afterlight-blueprints.json')
          before='npx --no-install prettier tests/afterlight-studies.test.cjs > test-results/afterlight-source/formatted-test.cjs'
          after='node tools/curation/afterlight-pictures.cjs --check\n          node --test tests/afterlight-studies.test.cjs tests/afterlight-readiness.test.cjs\n          sha256sum content/workshop/afterlight-pictures.json > test-results/afterlight-source/pack-sha256.txt'
          assert text.count(before)==1
          Path('.github/workflows/afterlight-controls.yml').write_text(text.replace(before,after))
          path=Path('docs/STATE.md')
          previous=path.read_text()
          note='\n## 2026-10-03: Afterlight optional picture studies (#563)\n\nTen newly authored 15 by 15 Picture Logic drawings are supplied as a data-only\nWorkshop import, not silently added to the official or startup registry. Exact\npixel blueprints, board-specific editorial notes, a reproducible clue compiler\nand the actual JSON pack live with 28 source/readiness regressions. Native and\nindependent solvers agree on one answer per board; all 2,250 squares are derived\nwithout reading answers and applied through the production reducer. The old\n510-definition prefix is byte-pinned. No save, dependency or budget changes.\nTwo trial drawings were rejected (ambiguity and a stalled line-deduction path).\nSee docs/curation/AFTERLIGHT-PICTURES.md for manual import, evidence boundaries\nand continuation. Five Expert and five Tricky labels are provisional, following\nthe data-first calibration direction, not human difficulty claims. The new lane\nrequires all twenty actual Workshop/control/offline board/viewport scenarios;\nfull final-head CI and independent review remain merge gates. Physical Android\nand TalkBack remain unverified in HUMAN_TODO.md.\n'
          assert '#563)' not in previous
          path.write_text(previous+note)
      - name: Compile, format and check exact source identities
        run: |
          set -eu
          npx --no-install prettier --write tools/curation/afterlight-pictures.cjs tests/afterlight-studies.test.cjs tests/afterlight-readiness.test.cjs
          node tools/curation/afterlight-pictures.cjs --write
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'content/workshop/afterlight-pictures.json':'b8c69faa5e2b43b1daee5c2d318b912f87b4262678b2582895952d0d8ef7bceb',
            'content/curation/editorial/afterlight-blueprints.json':'b62d0baa449e8531afab5575ec5a8272094e90662b17b1ba4922a5ec1c5c698c',
            'tests/browser_afterlight_studies.py':'6eb5317fbb979a30264067ec0ae5a42b43a3a5636b386645f5d61617561b6e46',
            'tests/afterlight-readiness.test.cjs':'34ee6ff1f8966f3dae08da6652a8218220594c712c49787ad453b47dc381e851',
            'tools/curation/afterlight-pictures.cjs':'23d4953bdd4b7dd6d0ffab6d341f00cff99aa82688a92226bde03ae059d7612b',
            'tests/afterlight-studies.test.cjs':'4780f5f5a8bdce5305462f372e87f1b79518fb665e668febd224969540dff491',
            '.github/workflows/afterlight-controls.yml':'06d367eda21da3d0c078b8086ca4419f86d4566d98f54da751cfc55038be48ca',
            'docs/curation/AFTERLIGHT-PICTURES.md':'4f8d1ffca2092ae14eb85a68f5d830fe5ec13e0c7e767d80558c9daca3d46483',
          }
          for name,digest in expected.items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==digest,(name,actual,digest)
          PY
          node tools/curation/afterlight-pictures.cjs --check
          node --test tests/afterlight-studies.test.cjs tests/afterlight-readiness.test.cjs
          python -m py_compile tests/browser_afterlight_studies.py
      - name: Commit only the bounded content slice
        run: |
          set -eu
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git rm .github/workflows/publish-afterlight-20261003.yml
          git add .github/workflows/afterlight-controls.yml content/curation/editorial/afterlight-blueprints.json content/workshop/afterlight-pictures.json docs/STATE.md docs/curation/AFTERLIGHT-PICTURES.md tests/afterlight-readiness.test.cjs tests/afterlight-studies.test.cjs tests/browser_afterlight_studies.py tools/curation/afterlight-pictures.cjs
          python - <<'PY'
          import os, subprocess
          expected={'.github/workflows/afterlight-controls.yml','content/curation/editorial/afterlight-blueprints.json','content/workshop/afterlight-pictures.json','docs/STATE.md','docs/curation/AFTERLIGHT-PICTURES.md','tests/afterlight-readiness.test.cjs','tests/afterlight-studies.test.cjs','tests/browser_afterlight_studies.py','tools/curation/afterlight-pictures.cjs'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only',os.environ['BASE_SOURCE']],text=True).splitlines())
          assert actual==expected,(actual,expected)
          PY
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'content: compile ten Afterlight Workshop pictures and exact-origin regression lane'
      - name: Verify clean source before branch publication
        run: |
          set -o pipefail
          mkdir -p test-results/afterlight-publication
          npm run verify 2>&1 | tee test-results/afterlight-publication/verify.log
          git rev-parse HEAD > test-results/afterlight-publication/source-head.txt
          git diff --binary "$BASE_SOURCE" HEAD > test-results/afterlight-publication/source.patch
          cp content/workshop/afterlight-pictures.json build-info.json test-results/afterlight-publication/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: afterlight-publication-evidence
          path: test-results/afterlight-publication/
          retention-days: 7
      - name: Publish only the unchanged content branch
        run: |
          set -eu
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
