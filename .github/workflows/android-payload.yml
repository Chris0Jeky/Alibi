name: Verify Android payload

on:
  pull_request:
    paths:
      - '.github/workflows/android-payload.yml'
      - 'docs/capacitor/BUILD-TARGETS.md'
      - 'package.json'
      - 'package-lock.json'
      - 'content/**'
      - 'assets-source/**'
      - 'src/**'
      - 'tools/build.cjs'
      - 'tools/build-*.cjs'
      - 'tools/check-android-artifact.cjs'
      - 'tests/android-build.test.cjs'
      - 'tests/browser_android_payload.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-payload.yml'
      - 'docs/capacitor/BUILD-TARGETS.md'
      - 'package.json'
      - 'package-lock.json'
      - 'content/**'
      - 'assets-source/**'
      - 'src/**'
      - 'tools/build.cjs'
      - 'tools/build-*.cjs'
      - 'tools/check-android-artifact.cjs'
      - 'tests/android-build.test.cjs'
      - 'tests/browser_android_payload.py'

permissions:
  contents: read

concurrency:
  group: android-payload-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check repository formatting
        run: npm run format:check
      - name: Derive Android payload
        run: npm run build:android
      - name: Audit Android artifact
        run: npm run check:android
      - name: Exercise deterministic and tamper contracts
        run: node --test tests/android-build.test.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Boot local Android origin without a service worker
        run: python tests/browser_android_payload.py
      - name: Upload build receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-payload-receipts
          path: |
            dist-android/android-assets.json
            dist-android/android-build-identity.json
          if-no-files-found: warn
          retention-days: 14
