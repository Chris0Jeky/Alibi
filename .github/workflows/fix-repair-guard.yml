name: Fix discovery repair guard
on:
  push:
    branches:
      - feat/discovery-meta-cas-30
permissions:
  contents: write
concurrency:
  group: fix-discovery-repair-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/discovery-meta-cas-30
          fetch-depth: 0
      - name: Make optional-asset matching indentation independent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/repair-discovery-config.yml')
          source = path.read_text(encoding='utf-8')
          old = '''          sw_anchor = "              !n.startsWith('observatory.') &&\\n"
          if sw_source.count(sw_anchor) != 2:
              raise SystemExit(f'Expected two optional-asset filters, found {sw_source.count(sw_anchor)}')
          sw_test.write_text(
              sw_source.replace(
                  sw_anchor,
                  sw_anchor + "              !n.startsWith('discovery-storage.') &&\\n",
              ),
              encoding='utf-8',
          )
          '''
          new = '''          sw_lines = sw_source.splitlines(keepends=True)
          observatory_filters = [
              index
              for index, line in enumerate(sw_lines)
              if "!n.startsWith('observatory.') &&" in line
          ]
          if len(observatory_filters) != 2:
              raise SystemExit(f'Expected two optional-asset filters, found {len(observatory_filters)}')
          for index in reversed(observatory_filters):
              line = sw_lines[index]
              indent = line[: len(line) - len(line.lstrip())]
              sw_lines.insert(index + 1, indent + "!n.startsWith('discovery-storage.') &&\\n")
          sw_test.write_text(''.join(sw_lines), encoding='utf-8')
          '''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one repair guard block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-repair-guard.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/repair-discovery-config.yml
          git commit -m "fix(ci): match deferred asset filters by content"
          git push origin HEAD:feat/discovery-meta-cas-30
