name: Fix discovery repair guard
on:
  push:
    branches:
      - feat/discovery-meta-cas-30
permissions:
  contents: write
concurrency:
  group: fix-discovery-repair-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/discovery-meta-cas-30
          fetch-depth: 0
      - name: Make optional-asset matching indentation independent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/repair-discovery-config.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          starts = [
              index for index, line in enumerate(lines) if '          sw_anchor =' in line
          ]
          ends = [
              index for index, line in enumerate(lines) if index > (starts[0] if starts else -1) and line.strip() == 'PY'
          ]
          if len(starts) != 1 or len(ends) != 1 or starts[0] >= ends[0]:
              raise SystemExit(f'Unexpected repair guard boundaries: starts={starts}, ends={ends}')
          replacement = [
              "          sw_lines = sw_source.splitlines(keepends=True)\n",
              "          observatory_filters = [\n",
              "              index\n",
              "              for index, line in enumerate(sw_lines)\n",
              "              if \"!n.startsWith('observatory.') &&\" in line\n",
              "          ]\n",
              "          if len(observatory_filters) != 2:\n",
              "              raise SystemExit(f'Expected two optional-asset filters, found {len(observatory_filters)}')\n",
              "          for index in reversed(observatory_filters):\n",
              "              line = sw_lines[index]\n",
              "              indent = line[: len(line) - len(line.lstrip())]\n",
              "              sw_lines.insert(\n",
              "                  index + 1,\n",
              "                  indent + \"!n.startsWith('discovery-storage.') &&\\\\n\",\n",
              "              )\n",
              "          sw_test.write_text(''.join(sw_lines), encoding='utf-8')\n",
          ]
          lines[starts[0]:ends[0]] = replacement
          path.write_text(''.join(lines), encoding='utf-8')
          PY
          git rm .github/workflows/fix-repair-guard.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/repair-discovery-config.yml
          git commit -m "fix(ci): match deferred asset filters by content"
          git push origin HEAD:feat/discovery-meta-cas-30
