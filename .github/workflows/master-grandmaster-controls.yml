name: Master and Grandmaster controls
on:
  push:
    paths:
      - 'content/extra/master-grandmaster-studies.json'
      - 'content/official-packs.json'
      - 'tests/browser_master_grandmaster_controls.py'
      - '.github/workflows/master-grandmaster-controls.yml'
  pull_request:
    paths:
      - 'content/extra/master-grandmaster-studies.json'
      - 'content/official-packs.json'
      - 'tests/browser_master_grandmaster_controls.py'
      - '.github/workflows/master-grandmaster-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Main runs get a per-commit group: a later docs-only push must not cancel a full run.
  group: master-grandmaster-controls-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  browser-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: npm run build:web
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Complete all nine advanced studies through real controls
        run: |
          npm start > /tmp/alibi-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/ > /dev/null && break
            sleep 1
          done
          ALIBI_URL=http://127.0.0.1:8787 python tests/browser_master_grandmaster_controls.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: master-grandmaster-control-evidence
          path: test-results/master-grandmaster-controls/
          retention-days: 14
