name: Browser origin shard experiment

on: workflow_dispatch

permissions:
  contents: read

jobs:
  browser-origin-shadow:
    name: Browser origin shadow (${{ matrix.slice }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slice: [serial, '1', '2', '3', '4']
    env:
      PYTHONUTF8: '1'
      SHADOW_SLICE: ${{ matrix.slice }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Check command parity and record exact source
        run: |
          tested_sha=$(git rev-parse HEAD)
          printf 'event=%s\ncheckout=%s\n' "$GITHUB_SHA" "$tested_sha" > "$RUNNER_TEMP/alibi-origin-source.txt"
          test "$tested_sha" = "$GITHUB_SHA"
          node --test tests/ci-shadow/browser-origin.test.cjs
          node tools/ci-browser-origin-shadow.cjs "$SHADOW_SLICE" > "$RUNNER_TEMP/alibi-origin.sh"
      - run: npm ci
      - run: npm run build:android
      - run: node tools/check-test-build.cjs
      - run: python -m pip install -r requirements-dev.txt
      - name: Use Ubuntu repositories for Playwright system dependencies
        run: bash tools/ci-ubuntu-sources.sh
      - name: Install Chromium and its system dependencies
        run: node tools/ci-setup-phase.cjs --phase playwright-chromium --timeout-seconds 480 --grace-seconds 20 -- python -m playwright install --with-deps chromium
      - name: Time the real-origin browser commands
        run: |
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "$GITHUB_SHA"
          trap 'status=$?; printf "Browser origin shadow %s\n\nSource SHA %s\n\nElapsed %s seconds, exit %s.\n" "$SHADOW_SLICE" "$tested_sha" "$SECONDS" "$status" >> "$GITHUB_STEP_SUMMARY"' EXIT
          SECONDS=0
          bash -e "$RUNNER_TEMP/alibi-origin.sh"
      - name: Gather local shadow diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p test-results/shadow-evidence
          for file in "$RUNNER_TEMP/alibi-origin-source.txt" "$RUNNER_TEMP/alibi-origin.sh" /tmp/alibi-server.log /tmp/alibi-assets.log; do
            if [[ -f "$file" ]]; then cp -- "$file" test-results/shadow-evidence/; fi
          done
      - name: Upload shadow failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alibi-origin-failure-${{ matrix.slice }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/shadow-evidence/
            build-info.json
            dist/assets/alibi-platform-identity.*.js
            dist-android/android-build-identity.json
            test-results/browser-origin/browser-origin.json
            test-results/browser-origin/failure.png
            test-results/browser-backup-import.json
            test-results/quiet-focus/quiet-focus-timeout-*.json
            test-results/atmosphere/image-failure.json
            test-results/**/results.json
            test-results/**/receipt.json
            test-results/**/failure-*.json
          if-no-files-found: warn
          retention-days: 14
