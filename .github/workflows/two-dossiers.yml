name: Two-dossier offline experiment
on:
  pull_request:
    paths:
      - '.github/workflows/two-dossiers.yml'
      - 'tools/ci-setup-phase.cjs'
      - 'requirements-dev.txt'
      - 'prototypes/two-dossiers/**'
      - 'tests/two-dossiers.test.mjs'
      - 'tests/browser_two_dossiers.py'
      - 'docs/state/2026-10-31-issue-451-two-dossiers.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: two-dossiers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  two-dossiers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Check the independent finite oracle
        run: node --test tests/two-dossiers.test.mjs
      - run: python -m pip install -r requirements-dev.txt
      - name: Use Ubuntu repositories for Chromium system dependencies
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' \
            'Dir::Etc::sourceparts "-";' \
            | sudo tee /etc/apt/apt.conf.d/99alibi-ci-sources >/dev/null
      - name: Install bounded Chromium tooling
        run: node tools/ci-setup-phase.cjs --phase two-dossiers-chromium --timeout-seconds 480 --grace-seconds 20 -- python -m playwright install --with-deps chromium
      - name: Exercise actual controls and preserve source-bound artifacts
        run: python tests/browser_two_dossiers.py
      - name: Refuse source mutation during qualification
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: two-dossiers-${{ github.run_id }}
          path: test-results/two-dossiers/
          # The fixture copies only enumerated public proof inputs, including this workflow.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
