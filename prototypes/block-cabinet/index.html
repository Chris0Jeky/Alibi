<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#132d29" />
    <title>Alibi · Block Cabinet Studio</title>
    <link rel="stylesheet" href="../../src/block-cabinet/style.css" />
    <style>
      html {
        background: #e8e4d6;
      }
      body {
        margin: 0;
        padding: clamp(10px, 3vw, 40px);
        min-height: 100dvh;
        background: radial-gradient(ellipse at top, #f5f0e3, #dedbcc);
        box-sizing: border-box;
      }
      main {
        max-width: 1100px;
        margin: auto;
      }
      footer {
        font: 11px/1.8 system-ui;
        text-align: center;
        color: #596957;
        padding: 20px;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main id="game"></main>
    <footer>
      BLOCK CABINET STUDIO · A PLAYABLE ENGINE STUDY<br />Original game art and sound. Classic demo
      and Cascade experiment have separate rules and saves.
    </footer>
    <script type="module">
      import { mountPrototype } from '../../src/block-cabinet/studio.mjs';
      mountPrototype(document.getElementById('game')).catch((e) => {
        document.getElementById('game').textContent = e.message;
      });
    </script>
  </body>
</html>
